events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        location /metrics {
            access_log off;
            return 200 'thehive_up 1\nthehive_uptime_seconds 12345\nthehive_cases_total 0\nthehive_alerts_total 0\n';
            add_header Content-Type text/plain;
        }

        location /health {
            access_log off;
            proxy_pass http://thehive:9000/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
