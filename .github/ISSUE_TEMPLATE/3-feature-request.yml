name: "🚀🆕 Feature Request"
description: "Suggest an idea or possible new feature for this project."
title: "[Feature] [WBS x.y] <título breve>"
labels: ["feature", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        # **🚀 Feature Request**
        Completa los campos para describir la funcionalidad y enlazarla con la EDT.

  - type: input
    id: wbs
    attributes:
      label: "WBS ID"
      description: "ID del paquete de trabajo (p. ej., 4.4, 6.5, 7.2)."
      placeholder: "x.y"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "Área (EDT nivel 1)"
      options:
        - "1 · Iniciación y Alcance"
        - "2 · Planificación del Proyecto"
        - "3 · Diseño de Arquitectura"
        - "4 · Preparación del Entorno"
        - "5 · Integración de Herramientas"
        - "6 · Desarrollo de Playbooks"
        - "7 · Pruebas y Validación"
        - "8 · Documentación y Entregables"
        - "9 · Gestión del Proyecto"
    validations:
      required: true

  - type: dropdown
    id: tipo
    attributes:
      label: "Tipo"
      description: "Clasifica la issue para crear la rama con el prefijo apropiado."
      options:
        - "programacion"
        - "documentacion"
        - "configuracion"
        - "pruebas"
        - "gestion"
      default: 0
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: "Describe the feature."
      description: "A clear and concise description of what the feature is."
      placeholder: "Qué se necesita y por qué."
    validations:
      required: true

  - type: textarea
    id: deliverable
    attributes:
      label: "Deliverable / Output"
      description: "¿Qué se entrega exactamente?"
      placeholder: "Documento, script, diagrama, configuración, evidencias, etc."
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "Tareas o condiciones previas (WBS o issues relacionadas)."
      placeholder: "p. ej., 3.1, 4.3, #12"
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options: ["P0 (Crítica)", "P1 (Alta)", "P2 (Media)", "P3 (Baja)"]
      default: 2
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: "Describe the solution you'd like."
      description: "A clear and concise description of what you want to happen."
      value: |
        **Acceptance criteria (DoD)**
        - [ ] Funciona en entorno de laboratorio aislado.
        - [ ] Evidencias adjuntas (capturas/logs en `docs/` o `tests/`).
        - [ ] Configuración versionada y reproducible (IaC/scripts).
        - [ ] Documentación actualizada (README/docs).
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: "Additional context"
      description: "Add any other context or additional information about the problem here."
      placeholder: "Riesgos/mitigaciones, enlaces a docs/tutos, notas."
    validations:
      required: false


