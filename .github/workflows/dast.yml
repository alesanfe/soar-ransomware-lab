# DAST gate (SEC-GATE): OWASP ZAP baseline + API scan against the lab's
# own attack surfaces. Scheduled weekly + manual dispatch — per-PR would
# be too heavy (the scan target needs a live compose subset).
name: DAST

on:
  schedule:
    - cron: '0 4 * * 1'  # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2

      - name: Start minimal scan target (ES + Redis + API + Web Management)
        run: |
          cp .env.example .env.full
          docker compose \
            --env-file .env.full \
            -f infra/docker/compose/docker-compose.yml \
            -f infra/docker/compose/docker-compose.api.yml \
            up -d elasticsearch redis api web-management

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API healthy after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "API failed to become healthy"; docker logs soar_api --tail 50; exit 1

      - name: ZAP API scan (OpenAPI surface)
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: 'http://localhost:8000/openapi.json'
          format: openapi
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -l FAIL'

      - name: ZAP baseline — Web Management console
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:8085'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -l FAIL'

      - name: ZAP baseline — API portal
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -l FAIL'

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b7176d604f7f0f6 # v4
        with:
          name: zap-reports
          path: |
            *_report.html
            *_report.md
            *_report.json
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          docker compose \
            -f infra/docker/compose/docker-compose.yml \
            -f infra/docker/compose/docker-compose.api.yml \
            down -v
