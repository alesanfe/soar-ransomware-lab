name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'apps/docs-site/**'
      - 'reports/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Sync docs to Docusaurus
        run: python scripts/ci/sync_docs_to_docusaurus.py
      - name: Upload synced docs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: synced-docs
          path: apps/docs-site/docs/

  generate-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,quality]"
      - name: Generate quality report
        run: |
          mkdir -p reports/quality
          python scripts/quality/run_quality_checks.py --report-only --output-dir reports/quality
      - name: Generate test review
        run: |
          mkdir -p reports/test-review
          python scripts/reports/test_review.py --output-dir reports/test-review
      - name: Generate holistic review
        run: |
          mkdir -p reports/holistic
          python scripts/reports/holistic_review.py --output-dir reports/holistic
      - name: Sync reports to Docusaurus
        run: python scripts/ci/sync_reports_to_docusaurus.py
      - name: Upload reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: docusaurus-reports
          path: apps/docs-site/docs/reports/

  build:
    needs: [sync-docs, generate-reports]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Download synced docs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: synced-docs
          path: apps/docs-site/docs/
      - name: Download reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: docusaurus-reports
          path: apps/docs-site/docs/reports/
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: apps/docs-site
        run: npm ci
      - name: Build Docusaurus
        working-directory: apps/docs-site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: apps/docs-site/build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
