name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        working-directory: infra/docker/compose
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.core.yml \
            -f docker-compose.misp.yml \
            -f docker-compose.api.yml \
            -f docker-compose.opensearch.yml \
            -f logging/docker-compose.logging.yml \
            config

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint with flake8
        run: |
          flake8 src/soar_lab --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/soar_lab --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
      - name: Check formatting with black
        run: black --check src/soar_lab
      - name: Check import sorting with isort
        run: isort --check-only src/soar_lab
      - name: Type check with mypy
        run: mypy src/soar_lab --ignore-missing-imports
      - name: Check Python syntax with compileall
        run: python -m compileall -q src tests

  lint-bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint bash scripts
        run: |
          find infra src -name "*.sh" -print0 | xargs -0 shellcheck

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --cov=src.soar_lab --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  test-integration:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24
        options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2
      - name: Start services
        run: |
          cp .env.example .env.full
          docker compose \
            -f infra/docker/compose/docker-compose.yml \
            -f infra/docker/compose/docker-compose.core.yml \
            -f infra/docker/compose/docker-compose.api.yml \
            up -d
          sleep 60
      - name: Run integration tests
        run: python -m pytest tests/integration/ -v
      - name: Cleanup
        run: |
          docker compose \
            -f infra/docker/compose/docker-compose.yml \
            -f infra/docker/compose/docker-compose.core.yml \
            -f infra/docker/compose/docker-compose.api.yml \
            down -v

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  backup-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test backup service
        run: |
          pip install -e .
          python3 -c "from soar_lab.application.use_cases.backup_service import BackupService; print('BackupService import OK')"

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: apps/docs-site
        run: npm ci
      - name: Build documentation
        working-directory: apps/docs-site
        run: npm run build
      - name: Upload docs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: apps/docs-site/build/

  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: 'docs/**/*.md'
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline docs/ README.md CONTRIBUTING.md
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
      - name: Check terminology
        run: python scripts/ci/terminology_check.py docs/
      - name: Validate OpenAPI contracts
        run: python -m pytest tests/integration/test_openapi_spec_sync.py -v
      - name: Documentation quality
        run: python scripts/ci/docs_quality.py
      - name: Pytest collect-only
        run: python -m pytest --collect-only -q
