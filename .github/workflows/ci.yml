name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate docker-compose
        working-directory: infra/docker/compose
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.core.yml \
            -f docker-compose.misp.yml \
            -f docker-compose.api.yml \
            -f docker-compose.opensearch.yml \
            -f logging/docker-compose.logging.yml \
            config
      - name: Compose security invariants (hardened, fail-closed)
        run: python scripts/setup/validate_compose_security.py --profile hardened

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,quality]"
      - name: Lint with flake8
        run: |
          flake8 src/soar_lab --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/soar_lab --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
      - name: Dead code gate (vulture)
        run: vulture src/soar_lab --min-confidence 80
      - name: HTTP timeout matrix gate (R4)
        # Every raw HTTP call in src/ must set timeout= — a bare
        # requests/session call hangs forever on a dead peer.
        run: python scripts/ci/check_http_timeouts.py
      - name: Dependency vulnerability gate (pip-audit)
        run: pip-audit --strict
      - name: Minimum release age gate (SC5)
        # Newest-in-range release must be ≥7 days old — catches
        # supply-chain artifacts before they're broadly vetted.
        run: python scripts/ci/check_dep_freshness.py --min-age-days 7
      - name: Check formatting with black
        run: black --check src/soar_lab
      - name: Check import sorting with isort
        run: isort --check-only src/soar_lab
      - name: Type check with mypy
        run: mypy src/soar_lab --ignore-missing-imports
      - name: Check Python syntax with compileall
        run: python -m compileall -q src tests
      - name: Scripts compile-all smoke (MNT-01)
        # Syntax/import-level breakage across scripts/ — no execution.
        run: python -m compileall -q scripts
      - name: Makefile target parity gate (INFRA-01)
        # Makefile.win and Makefile.linux must expose the same target
        # names — the root Makefile delegates by OS.
        run: python scripts/ci/check_makefile_parity.py
      - name: Scripts manifest freshness gate (MNT-01)
        run: python scripts/ci/generate_scripts_manifest.py --check
      - name: Secret scan (BL-SEC-013)
        run: python scripts/safety/scan_secrets.py

  lint-bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint bash scripts
        run: |
          find infra src -name "*.sh" -print0 | xargs -0 shellcheck

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --cov=src.soar_lab --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: ./coverage.xml

  test-integration:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24
        options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2
      - name: Start services
        run: |
          cp .env.example .env.full
          docker compose \
            -f infra/docker/compose/docker-compose.yml \
            -f infra/docker/compose/docker-compose.core.yml \
            -f infra/docker/compose/docker-compose.api.yml \
            up -d
          sleep 60
      - name: Run integration tests
        run: python -m pytest tests/integration/ -v
      - name: Cleanup
        run: |
          docker compose \
            -f infra/docker/compose/docker-compose.yml \
            -f infra/docker/compose/docker-compose.core.yml \
            -f infra/docker/compose/docker-compose.api.yml \
            down -v

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: 'true'
          exit-code: '1'
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@b7b84b636b4f90c9b31da1bc5f72bfadd5b31410 # v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  architecture-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e .[quality]
      - name: Check import contracts (ARC-002)
        run: lint-imports

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.11'
      - name: Install project + cyclonedx
        run: pip install -e . cyclonedx-bom
      - name: Generate CycloneDX SBOM (DEV-002)
        run: cyclonedx-py environment --of JSON -o sbom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b7d0e84a10a4e2f97d1ba5af9f1c25f22b1f6c99 # v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json

  mutation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e ".[test,quality]"
      - name: Mutation gate on canonical statistics (TST-003)
        # Bounded scope: the new statistical core has dedicated tests,
        # so surviving mutants here mean genuinely weak assertions.
        # 'mutmut junitxml' emits one <testcase> per mutant — failures
        # are survivors, giving a machine-readable score.
        run: |
          mutmut run --paths-to-mutate=src/soar_lab/domain/statistics.py \
                     --tests-dir=tests/unit/domain/test_statistics_core.py \
                     --no-progress || true
          mutmut junitxml > mutmut.xml || true
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          try:
              root = ET.parse("mutmut.xml").getroot()
          except Exception:
              print("No mutmut report — nothing to gate"); sys.exit(0)
          cases = root.iter("testcase")
          total = survived = 0
          for c in cases:
              total += 1
              if c.find("failure") is not None:
                  survived += 1
          if total == 0:
              print("No mutants generated"); sys.exit(0)
          score = (total - survived) / total * 100
          print(f"Mutation score: {score:.1f}% ({total-survived}/{total} killed)")
          if score < 80:
              print("MUTATION GATE FAILED (<80%)"); sys.exit(1)
          PY

  backup-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test backup service
        run: |
          pip install --break-system-packages --ignore-installed -e .
          python3 -c "from soar_lab.application.use_cases.backup_service import BackupService; print('BackupService import OK')"

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: apps/docs-site
        run: npm ci
      - name: Build documentation
        working-directory: apps/docs-site
        run: npm run build
      - name: Upload docs artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation
          path: apps/docs-site/build/

  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@eb5ca3ab411449c66620fe7f1b3c9e10547144b0 # v18
        with:
          globs: 'docs/**/*.md'
      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline docs/ README.md CONTRIBUTING.md
        continue-on-error: true
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@f8221ca52ac51bf66228d6ec3691f3ea0782ae15 # main
        with:
          path: ./
          base: main
          # Only fail on verified live credentials — placeholder examples in
          # .env.example / docs must not break the pipeline.
          extra_args: --only-verified
      - name: Check terminology
        run: python scripts/ci/terminology_check.py docs/
      - name: Validate OpenAPI contracts
        run: python -m pytest tests/integration/test_openapi_spec_sync.py -v --no-cov
      - name: Documentation quality
        run: python scripts/ci/docs_quality.py
      - name: Pytest collect-only
        run: python -m pytest --collect-only -q
