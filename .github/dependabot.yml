version: 2
# SC3 — automated dependency bumps across every ecosystem in the repo.
# Base images are version-pinned in Dockerfiles; dependabot proposes
# bump PRs instead of silently floating tags.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/docs-site"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/web-management"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/infra/docker/images/app-ca"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/infra/docker/images/cortex"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/infra/docker/images/orborus"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/infra/docker/images/worker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/infra/docker/taxii"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/src/soar_lab/infrastructure/network_watcher"
    schedule:
      interval: "weekly"
    # infra/docker/cortex-analyzers/robtex-*-patched: deprecated images
    # kept for historical compat (AGENTS.md) — intentionally untracked.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/apps/docs-site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
