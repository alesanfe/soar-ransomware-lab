title: Credential stuffing / password spray burst
id: soar-lab-0005
status: experimental
description: Burst of failed authentications from one source against many accounts
  — stuffing or spray before ransomware initial access.
logsource:
  product: soar-lab
detection:
  selection:
    data.event_type:
    - auth_failed
    - login_failed
    data.fail_count|gt:
    - 20
  condition: selection
level: high
tags:
- attack.credential_access
- attack.t1110.004
- attack.t1078
falsepositives:
- Misconfigured sync agents retrying expired credentials at high frequency
- Load-balanced authentication probes counted as a single source
references:
- https://attack.mitre.org/techniques/T1110/004/
- https://attack.mitre.org/techniques/T1078/
