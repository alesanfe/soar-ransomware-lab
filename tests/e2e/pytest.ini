[pytest]
timeout_method = signal
addopts = --import-mode=importlib
filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning
markers =
    e2e: tests end-to-end
    smoke: comprobaciones rápidas de disponibilidad
    functional: comportamiento funcional
    integration: integración entre servicios
    resilience: fallos y recuperación
    security: controles de seguridad
    forensic: integridad y cadena de custodia
    performance: rendimiento y carga
    ui: pruebas con navegador
    destructive: modifica o reinicia infraestructura
    slow: pruebas de larga duración
    certification: certificación completa del stack
    requires_docker: requiere Docker daemon disponible
    requires_external: requiere servicios externos levantados
