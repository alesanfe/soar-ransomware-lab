apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "soar-api.fullname" . }}
  labels:
    {{- include "soar-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "soar-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "soar-api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "soar-api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: REDIS_URL
              value: {{ .Values.integrations.redisUrl | quote }}
            - name: THEHIVE_URL
              value: {{ .Values.integrations.thehiveUrl | quote }}
            - name: CORTEX_URL
              value: {{ .Values.integrations.cortexUrl | quote }}
            - name: MISP_URL
              value: {{ .Values.integrations.mispUrl | quote }}
            - name: ELASTICSEARCH_URL
              value: {{ .Values.integrations.elasticsearchUrl | quote }}
            - name: SHUFFLE_BACKEND_URL
              value: {{ .Values.integrations.shuffleBackendUrl | quote }}
            {{- range .Values.secretEnvRefs }}
            {{- $secretName := .name }}
            {{- range .keys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          volumeMounts:
            {{- if .Values.tmpVolume.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
      volumes:
        {{- if .Values.tmpVolume.enabled }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpVolume.sizeLimit }}
        {{- end }}
