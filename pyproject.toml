[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soar-lab"
version = "1.4.0"
description = "SOAR Ransomware Lab for Security Research"
authors = [{ name = "SOAR Lab Team", email = "team@soar-lab.org" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0,<0.163",
    "uvicorn>=0.23.0,<0.50",
    # PERF: C-extensions for the ASGI server — uvloop (libuv event loop,
    # no Windows wheels → platform marker) + httptools (llhttp parser).
    # uvicorn --loop auto selects uvloop automatically when installed.
    "uvloop>=0.19,<0.22; sys_platform != 'win32'",
    "httptools>=0.6,<0.7",
    "pydantic>=2.0.0,<3.0",
    "redis>=4.0.0,<9.0",
    "docker>=6.0.0,<8.0",
    "psutil>=5.9.0,<8.0",
    "PyJWT>=2.8.0,<3.0",
    "python-dotenv>=1.0.0,<2.0",
    # Imported directly by src/ — must not rely on transitive resolution
    # (fawltydeps check_undeclared).
    "requests>=2.31,<3.0",
    "starlette>=0.40,<2.0",
    "urllib3>=2.0,<3.0",
    "pyyaml>=6.0.0,<7.0",
    # O1: distributed tracing (enabled via OTEL_ENABLED=1; spans export
    # over OTLP/HTTP — FastAPI + requests auto-instrumented).
    "opentelemetry-sdk>=1.37.0,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.37.0,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.58b0,<0.59",
    "opentelemetry-instrumentation-requests>=0.58b0,<0.59",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<10.0",
    "pytest-cov>=4.0.0,<8.0",
    "pytest-asyncio>=0.21.0,<2.0",
    "black>=23.0.0,<27.0",
    "isort>=5.12.0,<7.0",
    "flake8>=6.0.0,<8.0",
    "mypy>=1.0.0,<3.0",
    "pre-commit>=3.0.0,<5.0",
]
test = [
    "pytest>=7.0.0,<10.0",
    "pytest-cov>=4.0.0,<8.0",
    "pytest-asyncio>=0.21.0,<2.0",
    "pytest-mock>=3.10.0,<4.0",
    "pytest-timeout>=2.1.0,<3.0",
    "pytest-xdist>=3.5.0,<4.0",
    "pytest-randomly>=3.15.0,<4.0",
    "requests-mock>=1.11.0,<2.0",
    "redis>=4.6.0,<9.0",
    # starlette>=1.10 TestClient requires an HTTP client — httpx2 is
    # preferred, httpx accepted as fallback (deprecation warning).
    "httpx2>=2.0.0,<3.0; python_version >= '3.11'",
    "httpx>=0.27.0,<1.0",
    # Imported by tests/quality + scripts/ci helpers (fawltydeps).
    "click>=8.0,<9.0",
    "packaging>=23.0,<27.0",
    "hypothesis>=6.100.0,<7.0",
    # Property-based OpenAPI contract fuzzing against the live API
    # (tests/integration/test_schemathesis_fuzz.py, requires_docker).
    "schemathesis>=4.30,<5.0",
    # aiohttp is used ONLY by the load/stress test harnesses under
    # tests/performance — production code is mono-stack on requests.
    "aiohttp>=3.9.0,<4.0",
]
quality = [
    "ruff>=0.1.0,<1.0",
    "vulture>=2.0.0,<3.0",
    "bandit>=1.7.0,<2.0",
    "radon>=5.0.0,<6.0",
    "flake8-docstrings>=1.6.0,<2.0",
    "flake8-bandit>=4.0.0,<5.0",
    "flake8-bugbear>=23.0.0,<26.0",
    "flake8-comprehensions>=3.10.0,<4.0",
    "flake8-quotes>=3.3.0,<4.0",
    "flake8-isort>=6.0.0,<8.0",
    "flake8-pytest-style>=1.6.0,<3.0",
    "pydoclint>=0.0.10,<1.0",
    "flake8-pyproject>=1.2.0,<2.0",
    "mutmut>=3.0.0,<4.0",
    "interrogate>=1.5.0,<2.0",
    "import-linter>=2.0.0,<3.0",
    "pip-audit>=2.6.0,<3.0",
]
reports = [
    "matplotlib>=3.8.0,<4.0",
    "numpy>=1.26.0,<3.0",
]

[tool.fawltydeps]
actions = ["check_undeclared", "check_unused"]
# Scope to maintained project code — infra/docker/cortex-analyzers contains
# vendored analyzer sources (cortexutils, cybox, pymisp, ...) shipped inside
# their own Docker images, and runtime/ + artifacts/ hold service data dirs.
code = ["src", "tests", "scripts", "apps/api"]
deps = ["pyproject.toml"]
ignore_undeclared = [
    # Local sibling-module imports (scripts/*, tests/e2e/base/*) resolved
    # via sys.path at runtime — not installed packages.
    "base", "build_dataset", "helpers", "calculate_quality_score",
    "score_evidence",
    "parse_bandit", "parse_coverage", "parse_vulture",
    "scan_secrets", "shuffle_workflow", "workflow_validator",
    # The project's own packages (installed via `pip install -e .`).
    "soar_lab", "scripts",
    # Auxiliary tooling used by scripts/perf + e2e — intentionally not
    # package deps (playwright needs its own browser install step).
    "locust", "playwright",
]
ignore_unused = [
    # flake8 plugins — loaded by flake8 itself, never imported.
    "flake8-bandit", "flake8-bugbear", "flake8-comprehensions",
    "flake8-docstrings", "flake8-isort", "flake8-pyproject",
    "flake8-pytest-style", "flake8-quotes",
    # pytest plugins — provide fixtures/plugins, no direct import needed.
    "pytest-asyncio", "pytest-mock", "pytest-randomly",
    "pytest-timeout", "pytest-xdist", "requests-mock",
    # uvicorn runtime extras — selected by presence, not imported.
    "uvloop", "httptools",
    # Quality/reporting tools — executed as CLIs, not imported.
    "bandit", "black", "flake8", "isort", "mypy", "pre-commit", "ruff",
    "interrogate", "mutmut", "pip-audit", "pydoclint", "radon",
    "vulture", "import-linter",
    # Imported lazily inside report generators (fawltydeps misses
    # function-level imports in scripts/reports/*).
    "matplotlib", "numpy",
    # Loaded via pytest.importorskip("schemathesis") in
    # tests/integration/test_schemathesis_fuzz.py — a dynamic import
    # fawltydeps cannot see.
    "schemathesis",
]

[tool.tryceratops]
# Style-only rules disabled (same posture as ruff's TRY defaults):
# TRY003 long messages in raise — idiomatic in this codebase (context-rich
#   error text beats generic exception subclasses for a lab tool).
# TRY300/TRY301 "move to else block" — readability preference.
# TRY004 prefer TypeError — sites reviewed: ValueError is the conventional
#   choice for *data* validation (json/HTTPException/TimeoutError cases).
# TRY101 too many try blocks — arbitrary count, not actionable.
ignore = ["TRY003", "TRY300", "TRY301", "TRY004", "TRY101"]

[tool.pydocstyle]
# Google convention matches the project's `Args:`/`Returns:` docstrings.
# D1xx presence checks are owned by interrogate + pydoclint — pydocstyle
# only gates docstring *style* (structure/content rules).
convention = "google"
# D202 (blank line after docstring) is left to the author's taste —
# both forms are readable and black accepts either.
add-ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D202"]

[project.scripts]
soar-lab = "soar_lab.interfaces.api.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["soar_lab*", "scripts*"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI Depends() in default args is idiomatic
# BLE001: blind-except (Exception catch-all) is acceptable in integration code
# S110: try-except-pass is acceptable for best-effort cleanup
# S112: try-except-continue is acceptable for best-effort loops
# DTZ003: datetime.utcnow() is acceptable in lab code (not production TZ-aware)
# DTZ007: datetime.strptime without zone is acceptable in lab code
# TRY002: raise vanilla Exception is acceptable in domain code
# SIM102: collapsible-if is a style preference
# SIM103: needless-bool is a style preference
# SIM117: multiple-with-statements is a style preference
# SIM118: in-dict-keys is a style preference
# RUF012: mutable-class-default is acceptable for class-level config dicts
# RUF013: implicit-optional is acceptable for backwards compat
# RUF022: unsorted-dunder-all is a style preference
# PIE810: multiple-starts-ends-with is a style preference
# B026: star-arg-unpacking-after-keyword-arg is acceptable
# PERF402: manual-list-copy is a style preference
# PLW1510: subprocess-run-without-check is acceptable in lab code
# TRY004: type-check-without-type-error is a style preference
# DTZ005: datetime.now() without tz is acceptable in lab code (not production TZ-aware)
# DTZ006: datetime.fromtimestamp() without tz is acceptable in lab code
# DTZ001: datetime() without tzinfo is acceptable in lab test code
# B017: pytest.raises(Exception) is a common pattern in test code
# LOG015: root logger calls are acceptable in standalone setup scripts
# FURB162: unnecessary timezone replacement is acceptable in lab code
# ISC004: unparenthesized string concatenation in collections is a style preference
# RUF059: unpacked variable never used is acceptable when tuple unpacking is intentional
# SIM115: context manager for file opening is acceptable in short-lived scripts
# PLW0602: global without assignment is acceptable for read-only globals
# PLW1508: invalid type for env var default is acceptable in test config
# ASYNC230: blocking file open in async function is acceptable in test code
# B023: loop variable binding in function definition is acceptable in test mocks
# UP031: percent format is acceptable in legacy scripts
# RUF015: prefer next() over slice is a style preference
# PERF102: use values() when only values needed is a style preference
ignore = [
    "B008",
    "BLE001",
    "S110",
    "S112",
    "DTZ001",
    "DTZ003",
    "DTZ005",
    "DTZ006",
    "DTZ007",
    "TRY002",
    "SIM102",
    "SIM103",
    "SIM115",
    "SIM117",
    "SIM118",
    "RUF012",
    "RUF013",
    "RUF015",
    "RUF022",
    "RUF059",
    "PIE810",
    "B017",
    "B023",
    "B026",
    "PERF102",
    "PERF402",
    "PLW0602",
    "PLW1508",
    "PLW1510",
    "LOG015",
    "FURB162",
    "ISC004",
    "ASYNC230",
    "UP031",
    "TRY004",
]

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = false
warn_unreachable = false
strict_equality = false

# Lab code uses dynamic attributes (mocks, protocol duck-typing) that
# produce false positives under strict attribute checking.
disable_error_code = [
    "attr-defined",
    "arg-type",
    "union-attr",
    "operator",
    "valid-type",
    "misc",
    "assignment",
    "call-arg",
    "index",
    "call-overload",
    "list-item",
    "return-value",
    "import-untyped",
]

# mypy-strict ratchet: leaf modules (no framework deps) are checked in
# full strict mode — new code there must be fully annotated. Expand the
# module list as strictness is rolled out; do NOT relax the global config.
# mypy-strict ratchet: leaf modules (no framework deps) are checked
# under the strict flag-set — new code there must be fully annotated.
# NOTE: `strict = true` is NOT used in overrides — in this mypy version it
# leaks to every module; the individual strict flags apply per-module.
# Expand the module list as strictness is rolled out; do NOT relax the
# global config.
[[tool.mypy.overrides]]
module = [
    "soar_lab.common.*",
    "soar_lab.domain.statistics",
    "soar_lab.domain.statistical_calculator",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
warn_unreachable = true
warn_no_return = true
disable_error_code = []

[tool.coverage.run]
source = ["src/soar_lab"]
branch = true
omit = [
    "*/domain/ports.py",
    "tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/cli.py",
    "*/scripts/setup/*.py",
    "*/interfaces/api/main.py",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mutmut]
# Mutation scope: the whole webhook/alert-ingestion pipeline — API
# middleware (auth/rate-limit/body-limit/headers/trace-id), Redis
# admission messaging, domain, security and resilience layers.
source_paths = [
    "src/soar_lab/interfaces/api/middleware/",
    "src/soar_lab/infrastructure/messaging/",
    "src/soar_lab/domain/",
    "src/soar_lab/security/",
    "src/soar_lab/resilience/",
]
pytest_add_cli_args = ["-q", "--tb=no", "--timeout=120", "--no-cov", "-o", "addopts=", "-o", "pythonpath=.", "-p", "no:cacheprovider", "--deselect", "tests/unit/test_property_based.py", "--deselect", "tests/unit/test_fase1_hardening.py::TestRepoRootDotenv::test_es_credentials_ignore_cwd_decoy"]
pytest_add_cli_args_test_selection = ["tests/unit/"]
# `*/ports/*` holds only Protocol `...` stubs — mutating declarations cannot
# produce observable behavior differences (equivalent mutants by construction)
do_not_mutate = ["src/soar_lab/__init__.py", "*/scripts/*", "*/tests/*", "*/ports/*"]
# Full src tree must be copied so mutants/src/soar_lab is a regular package that
# shadows any installed copy — otherwise the trampoline modules are never imported.
# Kept minimal on purpose: unit tests only need src + scripts + contracts —
# copying infra/apps/docs (~2.5G total incl. runtime data) made generation
# take ~20min and destabilised the Docker VM under bind-mount IO.
also_copy = ["src/", "scripts/", "contracts/", "pytest.ini", ".env.example", ".env.container", "playbooks/", "detections/", "infra/", "apps/docs-site/Dockerfile", "apps/web-management/nginx.conf", "docs/", "Makefile.linux", "Makefile.win"]
# -1 = unlimited depth (0 would record zero trampoline hits → "no tests found")
dependency_tracking_depth = -1

[tool.vulture]
# Dead-code gate (M3): run in CI as
#   vulture src/soar_lab --min-confidence 80
# These names are intentional: abstract/protocol signature params and
# the __exit__ protocol arguments must exist even when unused.
ignore_names = ["unit", "size_bytes", "test_result", "exc_type", "exc_val", "exc_tb"]
paths = ["src/soar_lab"]
min_confidence = 80

[tool.pydoclint]
# Constructor args are documented on __init__ docstrings (project style).
allow-init-docstring = true
