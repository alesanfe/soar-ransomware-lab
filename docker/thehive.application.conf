
# TheHive 3.x configuration (HOCON)
# Elasticsearch
search {
  index = the_hive
  uri = "http://elasticsearch:9200/"
  keepalive = 1m
  pagesize = 50
  nbshards = 5
  nbreplicas = 1
}

# Habilitar conector de Cortex
play.modules.enabled += connectors.cortex.CortexConnector

cortex {
  "cortex1" {
    url = "http://cortex:9001"
  }
}

# Almacenamiento de ficheros local
storage {
  provider = localfs
  localfs.location = "/opt/thp/thehive/files"
}

# Tamaños máximos
play.http.parser.maxDiskBuffer = 1GB
play.http.parser.maxMemoryBuffer = 10M

# Base URL (ajústala si usas proxy)
application.baseUrl = "http://localhost:9000"
