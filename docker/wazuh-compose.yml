version: "3.9"
name: wazuh-stack

services:
  # === Wazuh Manager ===
  wazuh-manager:
    image: wazuh/wazuh-manager:4.8.1
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_wazuh-manager
    hostname: wazuh-manager
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - WAZUH_CLUSTER_KEY=${WAZUH_CLUSTER_KEY:-wazuh-cluster-key}
      - WAZUH_CLUSTER_NAME=wazuh-cluster
      - WAZUH_CLUSTER_NODE=wazuh-manager
      - WAZUH_API_USER=${WAZUH_API_USER:-wazuh-api-user}
      - WAZUH_API_PASSWORD=${WAZUH_API_PASSWORD:-wazuh-api-password}
      - WAZUH_API_PORT=${WAZUH_API_PORT:-55000}
      - WAZUH_INDEXER_URL=${WAZUH_INDEXER_URL:-http://elasticsearch:9200}
      - WAZUH_INDEXER_USERNAME=${WAZUH_INDEXER_USERNAME:-elastic}
      - WAZUH_INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:-changeme}
      - WAZUH_INDEXER_SSL=${WAZUH_INDEXER_SSL:-false}
      - WAZUH_FILEbeat_SSL=${WAZUH_FILEBEAT_SSL:-false}
      - WAZUH_FILEbeat_SSL_VERIFY=${WAZUH_FILEBEAT_SSL_VERIFY:-false}
      - WAZUH_FILEbeat_SSL_CERTIFICATE_AUTHORITIES=${WAZUH_FILEBEAT_SSL_CERTIFICATE_AUTHORITIES:-/etc/ssl/certs/ca.pem}
      - WAZUH_FILEbeat_SSL_CERTIFICATE=${WAZUH_FILEBEAT_SSL_CERTIFICATE:-/etc/ssl/certs/cert.pem}
      - WAZUH_FILEBEAT_SSL_KEY=${WAZUH_FILEBEAT_SSL_KEY:-/etc/ssl/certs/key.pem}
    ports:
      - "${WAZUH_API_PORT:-55000}:55000"
      - "1514:1514"
      - "1515:1515"
      - "514/udp:514/udp"
      - "514/tcp:514/tcp"
    volumes:
      - wazuh_manager_data:/var/ossec/data
      - ./wazuh/wazuh_manager.conf:/var/ossec/etc/ossec.conf:ro
      - ./wazuh/api.yaml:/var/ossec/api/configuration/api.yaml:ro
      - ./wazuh/rules:/var/ossec/etc/rules:ro
      - ./wazuh/decoders:/var/ossec/etc/decoders:ro
    networks:
      - soar_net
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:55000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # === Wazuh Indexer ===
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.8.1
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_wazuh-indexer
    hostname: wazuh-indexer
    restart: always
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "cluster.name=wazuh-cluster"
      - "node.name=wazuh-indexer"
      - "bootstrap.memory_lock=true"
      - "cluster.initial_master_nodes=wazuh-indexer"
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
      - "xpack.security.authc.anonymous.roles=superuser"
      - "xpack.security.authc.anonymous.authc.exceptional_usernames=anonymous"
      - "http.host=0.0.0.0"
      - "transport.host=0.0.0.0"
    ports:
      - "${WAZUH_INDEXER_PORT:-9201}:9200"
    volumes:
      - wazuh_indexer_data:/usr/share/elasticsearch/data
    networks:
      - soar_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # === Wazuh Dashboard ===
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.8.1
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_wazuh-dashboard
    hostname: wazuh-dashboard
    restart: always
    environment:
      - WAZUH_API_URL=${WAZUH_API_URL:-http://wazuh-manager:55000}
      - WAZUH_API_USERNAME=${WAZUH_API_USER:-wazuh-api-user}
      - WAZUH_API_PASSWORD=${WAZUH_API_PASSWORD:-wazuh-api-password}
      - WAZUH_INDEXER_URL=${WAZUH_INDEXER_URL:-http://wazuh-indexer:9200}
      - WAZUH_INDEXER_USERNAME=${WAZUH_INDEXER_USERNAME:-elastic}
      - WAZUH_INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:-changeme}
      - WAZUH_DASHBOARD_USERNAME=${WAZUH_DASHBOARD_USERNAME:-wazuh-dashboard-user}
      - WAZUH_DASHBOARD_PASSWORD=${WAZUH_DASHBOARD_PASSWORD:-wazuh-dashboard-password}
      - WAZUH_DASHBOARD_PORT=${WAZUH_DASHBOARD_PORT:-443}
    ports:
      - "${WAZUH_DASHBOARD_PORT:-443}:443"
    volumes:
      - wazuh_dashboard_data:/usr/share/wazuh-dashboard/data
      - ./wazuh/dashboard_conf:/usr/share/wazuh-dashboard/data/conf:ro
    networks:
      - soar_net
    depends_on:
      wazuh-manager:
        condition: service_healthy
      wazuh-indexer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  wazuh_manager_data:
  wazuh_indexer_data:
  wazuh_dashboard_data:

networks:
  soar_net:
    external: true
