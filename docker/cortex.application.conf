
# Cortex 3.x configuration (HOCON)
# Secret: Generar con: openssl rand -hex 32
play.http.secret.key = "${CORTEX_SECRET:-changeme-32-char-secret-key-change-this-in-production}"

# ElasticSearch
search {
  index = cortex
  uri = "http://elasticsearch:9200"
}

# Cache de jobs (opcional)
cache.job = 10 minutes

# Escucha
http.port = 9001

# Directorio de trabajos (persistente via volumen)
job-directory = "/var/lib/cortex"
