# Prometheus web server config (GRAF-D10) — serves HTTPS on :9090 with a
# cert signed by the lab CA. Loaded via --web.config.file. Remote-write
# receiver and UI/API share the same TLS listener.
tls_server_config:
  cert_file: /etc/prometheus/tls/prometheus.crt
  key_file: /etc/prometheus/tls/prometheus.key
