# OpenTelemetry Collector — receives OTLP from the SOAR API (and any other
# instrumented service) and exports traces to Tempo.  Lab profile: minimal
# pipeline, no tail-sampling (traces are sparse enough to keep all).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
  telemetry:
    logs:
      level: info
    metrics:
      # Prometheus scrapes the collector's own pipeline metrics.
      address: 0.0.0.0:8888
