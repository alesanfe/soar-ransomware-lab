# TLS terminator for shuffle-backend (Go binary is http.ListenAndServe-only).
# network_mode: service:shuffle-backend — this nginx shares the backend's
# netns, so the plaintext hop is loopback-only and never crosses the bridge.
# External callers reach TLS on shuffle-backend:5443.
user  nginx;
worker_processes  1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    sendfile on;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 5443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/shuffle-backend.crt;
        ssl_certificate_key /etc/nginx/ssl/shuffle-backend.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:5m;
        ssl_session_timeout 10m;

        client_max_body_size 16m;

        location / {
            proxy_pass http://127.0.0.1:5001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            # WebSocket / long-poll streams used by execution updates
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
