events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=30s;

    # CORS allowlist (WEB-CORS-001): NEVER reflect arbitrary origins.
    # Same-origin API calls from the dashboard need no CORS at all; these
    # entries exist only for legitimate cross-origin tooling in the lab.
    map $http_origin $cors_allow_origin {
        default "";
        "https://localhost"      $http_origin;
        "https://localhost:8443" $http_origin;
        "https://soar.local"     $http_origin;
    }

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers (global)
    add_header X-Frame-Options "SAMEORIGIN" always;
    # EDGE-EVAL-001: X-XSS-Protection dropped (deprecated; CSP supersedes it —
    # modern guidance recommends absence, matching WEB-EVAL-003).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Proxy common settings
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost soar.local;

        # Health check (accessible por HTTP para Docker healthcheck)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Redirigir todo lo demás a HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS principal ───────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name localhost soar.local;

        ssl_certificate     /etc/nginx/ssl/soar.local.crt;
        ssl_certificate_key /etc/nginx/ssl/soar.local.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

        # ── Web Management Dashboard (raíz) ───────────────────────────────────
        location / {
            set $upstream_web web-management:8080;
            proxy_pass http://$upstream_web;
            location = /index.html {
                set $upstream_web_index web-management:8080;
                proxy_pass http://$upstream_web_index/index.html;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }
        }

        # ── TheHive ───────────────────────────────────────────────────────────
        location /thehive/ {
            set $upstream_thehive thehive:9443;
            rewrite ^/thehive/(.*)$ /$1 break;
            proxy_pass https://$upstream_thehive;
            proxy_ssl_trusted_certificate /etc/nginx/ssl/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_server_name on;
            proxy_ssl_name thehive;
            proxy_redirect ~^/(.*)$ /thehive/$1;
        }

        # ── Cortex ────────────────────────────────────────────────────────────
        location /cortex/ {
            set $upstream_cortex cortex:9443;
            rewrite ^/cortex/(.*)$ /$1 break;
            proxy_pass https://$upstream_cortex;
            proxy_ssl_trusted_certificate /etc/nginx/ssl/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_server_name on;
            proxy_ssl_name cortex;
            proxy_redirect ~^/(.*)$ /cortex/$1;
        }

        # ── Shuffle UI ────────────────────────────────────────────────────────
        # SPA con rutas absolutas (/assets/, /manifest.json) — no se puede
        # proxy bajo subpath sin recompilar. Acceder en http://localhost:8081
        # location /shuffle/ { ... }  deshabilitado

        # ── Shuffle API (webhook) ─────────────────────────────────────────────
        location /shuffle-api/ {
            client_max_body_size 2m;
            rewrite ^/shuffle-api/(.*)$ /$1 break;
            proxy_pass https://shuffle-backend:5443;
            proxy_ssl_trusted_certificate /etc/nginx/ssl/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_server_name on;
            proxy_ssl_name shuffle-backend;
        }


        # ── MISP ──────────────────────────────────────────────────────────────
        # MISP no soporta subpath proxy — acceder en https://localhost:8083

        # ── Lab API ───────────────────────────────────────────────────────────
        # /api/v1/* routes are registered in FastAPI WITH the /api prefix —
        # proxy them unmodified (longest-prefix match wins over /api/).
        location /api/v1/ {
            set $upstream_api_v1 api:8000;
            proxy_pass http://$upstream_api_v1;
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            add_header Vary "Origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 600 always;
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        location /api/ {
            set $upstream_api api:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream_api;
            # WEB-CORS-001/003: explicit allowlist — no origin reflection.
            # Empty $cors_allow_origin (unlisted Origin) → no ACAO header.
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            add_header Vary "Origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 600 always;
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # ── Documentación ─────────────────────────────────────────────────────
        # docs-site es una SPA con rutas absolutas — acceder en http://localhost:8086

        # ── Grafana ───────────────────────────────────────────────────────────
        # HTTP directo: http://localhost:8084 · HTTPS: https://soar.local:8444
        # (server dedicado abajo — no subpath para no romper links/render)

        # ── Health check ──────────────────────────────────────────────────────
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # ── Grafana sobre TLS (GRAF-D10) ──────────────────────────────────────────
    # Puerto dedicado → proxy raíz a grafana:3000. Grafana sirve HTTPS interno
    # con cert de la CA del lab: el edge verifica el upstream contra la CA
    # (proxy_ssl_verify on) → TLS end-to-end host↔nginx↔grafana.
    server {
        listen 8444 ssl;
        server_name localhost soar.local;

        ssl_certificate     /etc/nginx/ssl/soar.local.crt;
        ssl_certificate_key /etc/nginx/ssl/soar.local.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            proxy_pass https://grafana:3000;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_trusted_certificate /etc/nginx/ssl/ca.crt;
            proxy_ssl_server_name on;
            proxy_ssl_name grafana;
            # WebSocket live (dashboard updates) usa los headers ya fijados.
            proxy_set_header X-Grafana-Org-Id 1;
        }

        # Live push (watch) necesita upgrades WS — ya cubiertos por el bloque
        # global proxy_http_version 1.1 + Upgrade/Connection de arriba.
    }

}
