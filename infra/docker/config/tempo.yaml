# Grafana Tempo — trace backend for the OTel collector. Single-binary,
# local blocks on a bind volume; lab retention is short on purpose.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

# GRAF-OBS-02: derive RED metrics + service graphs from spans and
# remote-write them to Prometheus (traces_spanmetrics_*,
# traces_service_graph_*). Feeds the saturation dashboard node graph.
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: soar-lab
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
