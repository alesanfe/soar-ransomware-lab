# nginx proxy for Elasticsearch that works around the Apache
# HttpAsyncClient chunked-encoding race condition (HTTPASYNC-79) in
# TheHive/Cortex (elastic4s) on Docker Desktop Windows.
#
# The problem: ES 7.x responds to POST/bulk requests with
# Transfer-Encoding: chunked.  The Apache HttpAsyncClient used by
# elastic4s has a race condition processing chunked responses on
# keep-alive connections — the response is never delivered to the
# Java callback, causing a 30s SocketTimeoutException even though ES
# processed the request successfully.  GET requests work because ES
# responds with Content-Length for small search responses.
#
# The fix: nginx sits between elastic4s and ES, bufferizes the full
# response from ES, and re-sends it to the client with Content-Length
# (no chunked encoding) and Connection: close.  This eliminates both
# the chunked-encoding bug and the keep-alive pool race condition.
upstream elasticsearch_backend {
    server elasticsearch:9200;
    keepalive 16;
}

server {
    listen 9200;

    # Disable keep-alive to the Java client so the HttpAsyncClient does
    # not reuse connections (avoids the pool race condition).  nginx
    # will send "Connection: close" in the response.
    keepalive_timeout 0;

    location / {
        proxy_pass http://elasticsearch_backend;
        # Use HTTP/1.1 with keep-alive to the upstream (ES) for performance
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;

        # CRITICAL: buffer the full response from ES so we can send it
        # to the client with Content-Length instead of chunked encoding.
        # This is the key fix: nginx converts chunked -> Content-Length.
        proxy_buffering on;
        proxy_buffer_size 256k;
        proxy_buffers 16 256k;
        proxy_busy_buffers_size 512k;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50m;
    }
}
