name: soar-lab-opensearch

# === SOAR Ransomware Lab - OpenSearch Staging ===
# Este archivo reemplaza Elasticsearch por OpenSearch 2.10.0 para resolver
# la incompatibilidad de Shuffle 2.2.1 con Elasticsearch (error 405).
#
# Uso (staging, con datos separados):
#   docker compose --env-file ../../.env.full -f compose/docker-compose.opensearch.yml up -d

networks:
  soar_net:
    name: soar_net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: soar_net
    ipam:
      config:
        - subnet: 10.100.0.0/16

volumes:
  # GRAF-D6/GRAF-D8: real named volume (VM ext4), not a Windows bind-mount —
  # OpenSearch indexing fsync latency on the shared host fs was the measured
  # cause of "timeout awaiting response headers" → Shuffle backend 500s.
  opensearch_data:
    driver: local

services:
  opensearch:
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:2.10.0}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_opensearch
    environment:
      - cluster.name=soar-opensearch
      - node.name=soar-opensearch
      - discovery.type=single-node
      # Lab: disk watermark blocks index creation on shared Windows disks
      # (C: at >90% trips flood_stage) — disable the threshold, monitor via
      # `make check-disk` instead of blocking writes.
      - cluster.routing.allocation.disk.threshold_enabled=false
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g -Dlog4j2.formatMsgNoLookups=true"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}
      - plugins.security.disabled=${OPENSEARCH_SECURITY_DISABLED:-false}
      # 2.10 image runs install_demo_configuration.sh (demo certs + admin:admin)
      # on first secure boot unless disabled; our PKI makes it unnecessary.
      - DISABLE_INSTALL_DEMO_CONFIG=true
      # Lab PKI (infra/docker/config/certs): single-node transport+HTTP TLS
      # signed by the lab CA. admin_dn/nodes_dn use the minimal /CN= DNs of
      # admin.crt / opensearch.crt (generated ad-hoc — gen_certs.sh only
      # issues serverAuth EKU which transport rejects).
      - plugins.security.allow_default_init_securityindex=true
      - plugins.security.ssl.transport.pemcert_filepath=certs/opensearch.crt
      - plugins.security.ssl.transport.pemkey_filepath=certs/opensearch.key
      - plugins.security.ssl.transport.pemtrustedcas_filepath=certs/ca.crt
      - plugins.security.ssl.transport.enforce_hostname_verification=false
      - plugins.security.ssl.transport.resolve_hostname=false
      - plugins.security.ssl.http.enabled=true
      - plugins.security.ssl.http.pemcert_filepath=certs/opensearch.crt
      - plugins.security.ssl.http.pemkey_filepath=certs/opensearch.key
      - plugins.security.ssl.http.pemtrustedcas_filepath=certs/ca.crt
      - plugins.security.nodes_dn=CN=opensearch
      - plugins.security.authcz.admin_dn=CN=admin
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
      - ../config/certs/opensearch.crt:/usr/share/opensearch/config/certs/opensearch.crt:ro
      - ../config/certs/opensearch.key:/usr/share/opensearch/config/certs/opensearch.key:ro
      - ../config/certs/admin.crt:/usr/share/opensearch/config/certs/admin.crt:ro
      - ../config/certs/admin.key:/usr/share/opensearch/config/certs/admin.key:ro
      - ../config/certs/ca.crt:/usr/share/opensearch/config/certs/ca.crt:ro
      # Custom internal_users.yml (admin/kibanaserver = OPENSEARCH_PASSWORD) is
      # what allow_default_init_securityindex seeds the security index with.
      - ../config/opensearch/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml:ro
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-19201}:9200"
    networks:
      - soar_net
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS --cacert /usr/share/opensearch/config/certs/ca.crt -u \"admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD}\" 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=10s' || exit 1" ]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  opensearch-dashboards:
    image: ${OPENSEARCH_DASHBOARDS_IMAGE:-opensearchproject/opensearch-dashboards:2.10.0}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_opensearch_dashboards
    environment:
      - OPENSEARCH_HOSTS=["${SHUFFLE_OPENSEARCH_URL:-https://opensearch:9200}"]
      - OPENSEARCH_USERNAME=${OPENSEARCH_USERNAME:-admin}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
      # Service-account auth to OpenSearch without the interactive login
      # plugin (dashboards UX unchanged, wire still TLS+auth).
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - OPENSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/opensearch-dashboards/config/certs/ca.crt
      - OPENSEARCH_SSL_VERIFICATIONMODE=full
    volumes:
      - ../config/certs/ca.crt:/usr/share/opensearch-dashboards/config/certs/ca.crt:ro
    ports:
      - "127.0.0.1:${OPENSEARCH_DASHBOARDS_PORT:-5602}:5601"
    networks:
      - soar_net
    depends_on:
      - opensearch
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:5601/api/status || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
