# ==============================================================================
# SOAR Ransomware Lab - Vagrant overrides
# Replaces host bind mounts with native Docker volumes inside the VM to avoid
# VirtualBox shared-folder locking issues (e.g. Elasticsearch "Text file busy").
# ==============================================================================

volumes:
  es_data:
    driver: local
    driver_opts: null
  thehive_files:
    driver: local
  cortex_data:
    driver: local
  shuffle_apps:
    driver: local
  shuffle_files:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  misp_db:
    driver: local
  misp_files:
    driver: local
  misp_configs:
    driver: local
  misp_logs:
    driver: local
  wazuh_api_config:
    driver: local
  wazuh_etc:
    driver: local
  wazuh_queue:
    driver: local
  wazuh_var_multigroups:
    driver: local
  wazuh_integration_files:
    driver: local
  wazuh_active_response:
    driver: local
  wazuh_wodles:
    driver: local
  wazuh_logs:
    driver: local
  wazuh_config:
    driver: local
  kibana_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local

services:
  shuffle-backend:
    healthcheck:
      disable: true
  shuffle-frontend:
    depends_on:
      shuffle-backend:
        condition: service_started
