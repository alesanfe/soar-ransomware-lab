name: soar-lab-wazuh

# === Wazuh SIEM Stack ===

services:
  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.0
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_wazuh_manager
    environment:
      - INDEXER_URL=http://elasticsearch:9200
      - INDEXER_USERNAME=${ELASTIC_USERNAME:-elastic}
      - INDEXER_PASSWORD=${ELASTIC_PASSWORD}
      - INDEXER_CA_CERT=/etc/wazuh-indexer/certs/root-ca.pem
      - INDEXER_CERT=/etc/wazuh-indexer/certs/filebeat.pem
      - INDEXER_KEY=/etc/wazuh-indexer/certs/filebeat-key.pem
      - API_USERNAME=${WAZUH_API_USERNAME:-wazuh-wui}
      - API_PASSWORD=${WAZUH_API_PASSWORD:-T5a#7mP3$vL2@nQ8tW6!zY4&hF9sD1}
      - WAZUH_CLUSTER_KEY=${WAZUH_CLUSTER_KEY:-wazuh-soar-lab-cluster-key-2024x}
      - WAZUH_CLUSTER_NAME=soar-wazuh-cluster
      - WAZUH_CLUSTER_NODE_NAME=soar-wazuh-manager
      - WAZUH_CLUSTER_NODE_TYPE=master
    volumes:
      - wazuh_config:/wazuh-config-mount
      - wazuh_api_config:/var/wazuh/api/configuration/auth
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integration_files:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_wodles:/var/ossec/wodles
    ports:
      - "${WAZUH_API_PORT:-55100}:55000"
    #   - "${WAZUH_EVENTS_PORT:-15141}:1514"
    #   - "1515:1515"
    #   - "1516:1516"
    networks:
      - soar_net
    depends_on:
      elasticsearch:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -sk https://localhost:55000/ | grep -q 'Unauthorized\\|title' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kibana:
    image: docker.elastic.co/kibana/kibana:7.10.2
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=${ELASTIC_USERNAME:-elastic}
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - SERVER_NAME=kibana
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
      - XPACK_SECURITY_ENABLED=false
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2}
    volumes:
      - kibana_data:/usr/share/kibana/data
    ports:
      - "${WAZUH_DASHBOARD_PORT:-15601}:5601"
    networks:
      - soar_net
    depends_on:
      elasticsearch:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:5601/kibana/api/status || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
