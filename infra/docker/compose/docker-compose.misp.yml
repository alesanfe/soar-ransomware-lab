name: soar-lab-misp

# === MISP Threat Intelligence Stack ===

services:
  misp-db:
    image: ${MISP_DB_IMAGE:-mariadb:10.11}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_misp_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MISP_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MISP_DB_NAME:-misp}
      MYSQL_USER: ${MISP_DB_USER:-misp}
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD}
    volumes:
      - misp_db:/var/lib/mysql
    networks:
      - soar_net
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  misp-modules:
    image: ${MISP_MODULES_IMAGE:-ghcr.io/misp/misp-docker/misp-modules:v3.0.9}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_misp_modules
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.connect(('localhost',6666)); s.close()\" 2>/dev/null || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - soar_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  misp:
    image: ${MISP_CORE_IMAGE:-ghcr.io/misp/misp-docker/misp-core:v2.5.44}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_misp
    cap_add:
      - AUDIT_WRITE
    depends_on:
      misp-db:
        condition: service_healthy
      misp-modules:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BASE_URL: https://${MISP_HOSTNAME:-localhost}:${MISP_HTTPS_PORT:-8083}
      MYSQL_HOST: ${MISP_DB_HOST:-misp-db}
      MYSQL_PORT: ${MISP_DB_PORT:-3306}
      MYSQL_USER: ${MISP_DB_USER:-misp}
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD}
      MYSQL_DATABASE: ${MISP_DB_NAME:-misp}
      REDIS_HOST: ${MISP_REDIS_HOST:-redis}
      REDIS_PORT: ${MISP_REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ADMIN_EMAIL: ${MISP_ADMIN_EMAIL:-admin@soar.local}
      ADMIN_PASSWORD: ${MISP_ADMIN_PASSWORD}
      ADMIN_KEY: ${MISP_API_KEY}
      ADMIN_ORG: ${MISP_ADMIN_ORG:-SOAR Lab}
      MISP_EMAIL: ${MISP_EMAIL:-noreply@soar.local}
      MISP_CONTACT: ${MISP_CONTACT:-admin@soar.local}
      ENCRYPTION_KEY: ${MISP_ENCRYPTION_KEY}
      SALT: ${MISP_SALT}
      PHP_MEMORY_LIMIT: 2048M
      PHP_MAX_EXECUTION_TIME: 300
      PHP_UPLOAD_MAX_FILESIZE: 50M
      PHP_POST_MAX_SIZE: 50M
    command: >
      sh -c "chown -R www-data:www-data /var/www/MISP/app/Config
             && chmod -R 750 /var/www/MISP/app/Config
             && exec /entrypoint.sh"
    ports:
      - "${MISP_PORT:-8083}:80"
    volumes:
      - misp_files:/var/www/MISP/app/files
      - misp_logs:/var/www/MISP/app/tmp/logs
      - misp_configs:/var/www/MISP/app/Config
    networks:
      - soar_net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/users/heartbeat" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
