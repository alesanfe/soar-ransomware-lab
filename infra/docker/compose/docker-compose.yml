name: soar-lab

# === SOAR Ransomware Lab - Main Orchestrator ===
# This file defines networks, volumes, and elasticsearch service
#
# Usage:
#   docker compose --env-file ../../.env.full -f compose/docker-compose.yml -f compose/docker-compose.core.yml -f compose/docker-compose.misp.yml -f compose/docker-compose.wazuh.yml -f compose/docker-compose.api.yml up -d
#   docker compose --env-file ../../.env.full -f compose/docker-compose.yml -f compose/docker-compose.core.yml -f compose/docker-compose.misp.yml -f compose/docker-compose.wazuh.yml -f compose/docker-compose.api.yml -f compose/logging/docker-compose.logging.yml up -d
#
# Compose files:
#   - compose/docker-compose.yml         (networks, volumes, elasticsearch)
#   - compose/docker-compose.core.yml     (redis, thehive, cortex, shuffle)
#   - compose/docker-compose.misp.yml     (MISP threat intelligence)
#   - compose/docker-compose.wazuh.yml    (Wazuh SIEM)
#   - compose/docker-compose.api.yml      (API, docs, web-management, nginx)
#   - compose/logging/docker-compose.logging.yml  (Loki, Promtail, Grafana - optional)

networks:
  bridge:
    name: bridge
    external: true
  soar_edge:
    name: soar_edge
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: soar_edge
  soar_net:
    name: soar_net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: soar_net
    ipam:
      config:
        - subnet: 10.100.0.0/16
  ti_net:
    name: ti_net
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: ti_net
    ipam:
      config:
        - subnet: 172.22.0.0/16
  logging_net:
    name: logging_net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: logging_net
    ipam:
      config:
        - subnet: 172.23.0.0/16

volumes:
  # Core SOAR volumes
  es_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/elasticsearch
  thehive_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/thehive/files
  cortex_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/cortex
  shuffle_apps:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/shuffle/apps
  shuffle_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/shuffle/files
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/redis
  nginx_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/logs/nginx

  # MISP volumes
  misp_db:
    driver: local
  misp_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/misp/files
  misp_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/logs/misp
  misp_configs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/misp/configs

  # Wazuh volumes
  wazuh_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/wazuh/config
  wazuh_api_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/wazuh/api_config
  wazuh_etc:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/wazuh/etc
  wazuh_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/logs/wazuh
  wazuh_queue:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/wazuh/queue
  wazuh_var_multigroups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/wazuh/var_multigroups
  wazuh_integration_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/wazuh/integration_files
  wazuh_active_response:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/wazuh/active_response
  wazuh_wodles:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/wazuh/wodles
  kibana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/kibana

  # Centralized logging volumes
  loki_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/loki
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ARTIFACTS_DIR:-../../../artifacts}/data/grafana

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.17
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - action.auto_create_index=true
      - cluster.routing.allocation.disk.threshold_enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g -Dlog4j2.formatMsgNoLookups=true -Xlog:gc*=warning"
      - logger.deprecation.level=error
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-19200}:9200"
    networks:
      - soar_net
      - ti_net
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=10s' || exit 1" ]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
