name: soar-lab

# === SOAR Ransomware Lab - Main Orchestrator ===
# This file defines networks, volumes, and elasticsearch service
#
# Usage:
#   docker compose --env-file ../../.env.full -f compose/docker-compose.yml -f compose/docker-compose.core.yml -f compose/docker-compose.misp.yml -f compose/docker-compose.api.yml up -d
#   docker compose --env-file ../../.env.full -f compose/docker-compose.yml -f compose/docker-compose.core.yml -f compose/docker-compose.misp.yml -f compose/docker-compose.api.yml -f compose/logging/docker-compose.logging.yml up -d
#
# Compose files:
#   - compose/docker-compose.yml         (networks, volumes, elasticsearch)
#   - compose/docker-compose.core.yml     (redis, thehive, cortex, shuffle)
#   - compose/docker-compose.misp.yml     (MISP threat intelligence)
#   - compose/docker-compose.api.yml      (API, docs, web-management, nginx)
#   - compose/logging/docker-compose.logging.yml  (Loki, Promtail, Grafana - optional)

networks:
  bridge:
    name: bridge
    external: true
  soar_net:
    name: soar_net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: soar_net
    ipam:
      config:
        - subnet: 10.100.0.0/16
  ti_net:
    name: ti_net
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: ti_net
    ipam:
      config:
        - subnet: 172.22.0.0/16
  logging_net:
    name: logging_net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: logging_net
    ipam:
      config:
        - subnet: 172.23.0.0/16

volumes:
  # Core SOAR volumes
  es_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/data/elasticsearch
  thehive_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/data/thehive/files
  cortex_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/data/cortex
  shuffle_apps:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/data/shuffle/apps
  shuffle_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/data/shuffle/files
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/data/redis
  nginx_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/logs/nginx

  # MISP volumes
  misp_db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/data/misp/db
  misp_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/data/misp/files
  misp_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/logs/misp
  misp_configs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/data/misp/configs

  # Centralized logging volumes
  loki_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/data/loki
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/data/grafana

services:
  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:7.10.2}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=${ELASTIC_SECURITY_ENABLED:-false}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - action.auto_create_index=true
      - cluster.routing.allocation.disk.threshold_enabled=false
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms2g -Xmx2g -Dlog4j2.formatMsgNoLookups=true -Xlog:gc*=warning}"
      - logger.deprecation.level=error
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-19200}:9200"
    networks:
      - soar_net
      - ti_net
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS -u elastic:${ELASTIC_PASSWORD} 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=10s' || exit 1" ]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${ELASTICSEARCH_CPU_LIMIT:-2.0}'
          memory: ${ELASTICSEARCH_MEMORY_LIMIT:-4G}
        reservations:
          cpus: '${ELASTICSEARCH_CPU_RESERVATION:-1.0}'
          memory: ${ELASTICSEARCH_MEMORY_RESERVATION:-2G}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
