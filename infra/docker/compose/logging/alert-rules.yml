      source: prometheus
      component: redis-streams
      team: soar-ops
    annotations:
      summary: Consumer lag > 50 pending for 10m — admission consumer stalled (runbook
        20).
      runbook: docs/20-observability-runbooks.md#RB-02
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: soar_queue_consumer_lag
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 600
        to: 0
      model:
        conditions:
        - evaluator:
            params:
            - 50
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
  - uid: soar_admission_dead_rate
    title: Admissions dead-lettering
    condition: B
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: info
      source: prometheus
      component: admission
      team: soar-ops
    annotations:
      summary: Admissions being dead-lettered — rate(soar_admission_dead_total) >
        0 for 10m.
      runbook: docs/20-observability-runbooks.md#RB-05
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: rate(soar_admission_dead_total[10m])
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 600
        to: 0
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
  - uid: es_cluster_red
    title: Elasticsearch cluster RED
    condition: B
    for: 2m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
      source: elasticsearch
      component: storage
      team: soar-ops
    annotations:
      summary: ES cluster health is red — a primary shard is unassigned (runbook 20).
      runbook: docs/20-observability-runbooks.md#RB-03
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: sum(elasticsearch_cluster_health_status{color="red"})
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 300
        to: 0
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
  - uid: es_unassigned_shards
    title: Elasticsearch unassigned shards
    condition: B
    for: 15m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      source: elasticsearch
      component: storage
      team: soar-ops
    annotations:
      summary: More than 5 unassigned shards for 15m — single-node replica yellow
        is benign, beyond that investigate.
      runbook: docs/20-observability-runbooks.md#RB-03
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 900
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: elasticsearch_cluster_health_unassigned_shards
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 900
        to: 0
      model:
        conditions:
        - evaluator:
            params:
            - 5
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
  - uid: grafana_rule_eval_error
    title: Alert rules in error/nodata state
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      source: grafana
      component: metamonitoring
      team: soar-ops
    annotations:
      summary: Grafana rules evaluating to error or nodata — the alerting system itself
        is degraded (GRAF-021).
      runbook: docs/20-observability-runbooks.md#RB-05
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: sum(grafana_alerting_alerts{state=~"error|nodata"})
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 300
        to: 0
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
  - uid: soar_loki_goroutines_high
    title: Loki goroutines approaching pids_limit
    condition: B
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      source: prometheus
      component: loki
      team: soar-ops
    annotations:
      summary: 'go_goroutines{service="loki"} > 820 (80% of pids_limit 1024) for 10m.
        Loki goroutines map 1:1 to kernel threads under pids_limit — at the cap the
        healthcheck cannot fork and the container flaps (observed: 256 -> 512 -> 1024
        ceiling raises). Investigate a real goroutine leak vs sustained query load
        before raising again.'
      runbook: docs/20-observability-runbooks.md
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: go_goroutines{service="loki"}
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 600
        to: 0
      model:
        conditions:
        - evaluator:
            params:
            - 820
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
  - uid: cortex_success_rate_low
    title: Cortex analyzer success rate below 60%
    condition: D
    for: 15m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      source: elasticsearch
      component: cortex
      team: soar-ops
    annotations:
      summary: Cortex job success share in the last 30m fell under 60% (O-04 / KPI-06
        guard). Check analyzer inventory and recent miswirings (make validate-workflows,
        analyzer_inventory.json).
      runbook: docs/20-observability-runbooks.md
    data:
    - refId: A
      datasourceUid: elasticsearch
      relativeTimeRange:
        from: 1800
        to: 0
      model:
        datasource:
          type: elasticsearch
          uid: elasticsearch
        query: status:"Success"
        bucketAggs:
        - type: date_histogram
          field: createdAt
          id: '2'
          settings:
            interval: auto
            min_doc_count: 0
            trimEdges: 0
        metrics:
        - type: count
          id: '1'
        refId: A
        timeField: createdAt
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: elasticsearch
      relativeTimeRange:
        from: 1800
        to: 0
      model:
        datasource:
          type: elasticsearch
          uid: elasticsearch
        query: status:"Failure"
        bucketAggs:
        - type: date_histogram
          field: createdAt
          id: '2'
          settings:
            interval: auto
            min_doc_count: 0
            trimEdges: 0
        metrics:
        - type: count
          id: '1'
        refId: B
        timeField: createdAt
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: RA
      datasourceUid: __expr__
      relativeTimeRange:
        from: 1800
        to: 0
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        reducer: sum
        refId: RA
        type: reduce
    - refId: RB
      datasourceUid: __expr__
      relativeTimeRange:
        from: 1800
        to: 0
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: B
        intervalMs: 1000
        maxDataPoints: 43200
        reducer: sum
        refId: RB
        type: reduce
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 1800
        to: 0
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: 100 * $RB / ($RA + $RB + 0.0001)
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: math
    - refId: D
      datasourceUid: __expr__
      relativeTimeRange:
        from: 1800
        to: 0
      model:
        conditions:
        - evaluator:
            params:
            - 40
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: C
        intervalMs: 1000
        maxDataPoints: 43200
        refId: D
        type: threshold
  - uid: soar_workflow_executing_stuck
    title: Workflow execution stuck in EXECUTING
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
      source: prometheus
      component: shuffle-gc
      team: soar-ops
    annotations:
      summary: Oldest EXECUTING workflow older than the stale threshold — GC should
        have aborted it (runbook 20).
      runbook: docs/20-observability-runbooks.md#RB-01
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: soar_workflow_oldest_executing_seconds
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 600
        to: 0
      model:
        conditions:
        - evaluator:
            params:
            - 1800
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
- orgId: 1
  name: soar-observability-selfmon
  folder: SOAR Alerts
  interval: 1m
  rules:
  - uid: obs_probe_down
    title: Observability endpoint unreachable (blackbox)
    condition: B
    for: 3m
    noDataState: Alerting
    execErrState: Error
    labels:
      severity: critical
      source: prometheus
      component: metamonitoring
      team: soar-ops
    annotations:
      summary: A blackbox probe (TLS/HTTP/TCP) has failed for 3m — {{ $labels.instance
        }} is unreachable or its cert is invalid (OBS-022/023).
      runbook: docs/20-observability-runbooks.md#RB-16
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: min(probe_success)
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 600
        to: 0
      model:
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: min
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
  - uid: obs_prometheus_target_down
    title: Prometheus scrape target down
    condition: B
    for: 5m
    noDataState: Alerting
    execErrState: Error
    labels:
      severity: critical
      source: prometheus
      component: metamonitoring
      team: soar-ops
    annotations:
      summary: A scrape target is down for 5m — {{ $labels.job }} (OBS-022). 8/8 up
        is the release gate.
      runbook: docs/20-observability-runbooks.md#RB-17
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: sum(up == 0) or vector(0)
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 600
        to: 0
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
  - uid: obs_cert_expiry_30d
    title: Internal certificate expires within 30 days
    condition: B
    for: 1h
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      source: prometheus
      component: pki
      team: soar-ops
    annotations:
      summary: Certificate for {{ $labels.instance }} expires in <30d (OBS-046). Renew
        with make certs.
      runbook: docs/20-observability-runbooks.md#RB-18
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: min(probe_ssl_earliest_cert_expiry - time()) or vector(99999999)
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 300
        to: 0
      model:
        conditions:
        - evaluator:
            params:
            - 2592000
            type: lt
          operator:
            type: and
          query:
            params:
            - A
