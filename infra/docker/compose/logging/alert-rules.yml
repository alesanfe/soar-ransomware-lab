      watchdog: 'true'
      team: soar-ops
    annotations:
      summary: Dead-man's-switch heartbeat — this rule is ALWAYS firing. Its notifications
        prove the alert->webhook->API->Loki channel is alive (OBS-025). If they stop,
        obs_alert_channel_silent fires.
