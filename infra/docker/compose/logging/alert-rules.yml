# Provisioned Grafana alert rules (GRAF-003).
# Evaluated every minute against Loki/Elasticsearch. Rules fire in the
# UI (Alerting > Alert rules). Notification routing is intentionally
# out of scope — the lab evaluates rules without external receivers.
apiVersion: 1

groups:
  - orgId: 1
    name: soar-error-and-pipeline
    folder: SOAR Alerts
    interval: 1m
    rules:
      - uid: soar_high_error_log_rate
        title: High error log rate across SOAR services
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          source: loki
        annotations:
          summary: More than 20 error/exception lines in the last 5m across all containers.
          runbook_url: https://github.com/alesanfe/soar-ransomware-lab/blob/main/docs/04-operations.md
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange: {from: 900, to: 0}
            model:
              datasource: {type: loki, uid: loki}
              editorMode: code
              expr: sum(count_over_time({compose_project=~".+"} |~ "(?i)error|exception|traceback|fatal" [5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 900, to: 0}
            model:
              conditions:
                - evaluator: {params: [20], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions

      - uid: soar_api_error_burst
        title: Error burst in SOAR API logs
        condition: B
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          service: api
        annotations:
          summary: API logged >10 error lines in the last 5m — pipeline may be failing.
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange: {from: 900, to: 0}
            model:
              datasource: {type: loki, uid: loki}
              editorMode: code
              expr: sum(count_over_time({compose_service="api"} |~ "(?i)error|exception|traceback" [5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 900, to: 0}
            model:
              conditions:
                - evaluator: {params: [10], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions

      - uid: soar_workflow_failure_rate
        title: Elevated workflow failure rate (Elasticsearch)
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          source: elasticsearch
        annotations:
          summary: soar-metrics shows >5 failed workflow executions in the last 15m.
        data:
          - refId: A
            datasourceUid: elasticsearch
            relativeTimeRange: {from: 900, to: 0}
            model:
              datasource: {type: elasticsearch, uid: elasticsearch}
              query: 'decision.keyword:"BLOCK"'
              alias: "failed executions"
              bucketAggs:
                - type: date_histogram
                  field: "@timestamp"
                  id: "2"
                  settings: {interval: auto, min_doc_count: 0, trimEdges: 0}
              metrics:
                - type: count
                  id: "1"
              refId: A
              timeField: "@timestamp"
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 900, to: 0}
            model:
              conditions:
                - evaluator: {params: [5], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: max}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions

      - uid: soar_loki_ingest_stalled
        title: Loki log ingest stalled
        condition: B
        for: 10m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: warning
          source: loki
        annotations:
          summary: Zero log lines ingested in the last 10m — Promtail/Loki may be down.
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange: {from: 900, to: 0}
            model:
              datasource: {type: loki, uid: loki}
              editorMode: code
              expr: sum(count_over_time({compose_project=~".+"}[10m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 900, to: 0}
            model:
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
