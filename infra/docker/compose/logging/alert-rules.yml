  - uid: obs_admission_slo_burn_rate
    title: Admission SLO burning too fast
    condition: B
    for: 15m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      source: prometheus
      component: slo
      team: soar-ops
    annotations:
      summary: Admission error ratio exceeds 14.4x the 1% error budget on both 5m
        and 1h windows — fast-burn alert (SLO 99% admission success).
      runbook: docs/20-observability-runbooks.md#RB-02
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 3600
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: "(\n  sum(rate(soar_admission_dead_total[5m]))\n  /\n  sum(rate(soar_admission_processed_total[5m])\
          \ + rate(soar_admission_dead_total[5m]))\n) > 0.144 and (\n  sum(rate(soar_admission_dead_total[1h]))\n\
          \  /\n  sum(rate(soar_admission_processed_total[1h]) + rate(soar_admission_dead_total[1h]))\n\
          ) > 0.144"
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 3600
        to: 0
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
