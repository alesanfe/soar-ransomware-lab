auth_enabled: false

server:
  http_listen_port: 3100

memberlist:
  join_members:
    - loki

common:
  path_prefix: /var/lib/loki
  # GRAF-D5: chunks + index live in SeaweedFS (S3-compatible object
  # storage), not the container filesystem — production-shape storage.
  # Loki 2.9 common.storage accepts exactly one backend; this deployment
  # does not run the ruler, so no rules_directory is needed.
  storage:
    s3:
      endpoint: s3:8333
      bucketnames: loki
      access_key_id: ${S3_ACCESS_KEY}
      secret_access_key: ${S3_SECRET_KEY}
      insecure: true
      s3forcepathstyle: true
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h

# Dashboards + alert evals + E2E bursts hit the default outstanding-request
# cap (429 "too many outstanding requests"). Raise it for the lab load.
query_scheduler:
  max_outstanding_requests_per_tenant: 4096

compactor:
  working_directory: /var/lib/loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: s3

# By default, Loki will send anonymous, but uniquely identifiable usage statistics to Grafana Labs.
# To disable statistics, set analytics.reporting_enabled to false
analytics:
  reporting_enabled: false
