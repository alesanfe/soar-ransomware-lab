name: soar-lab-logging

# === Centralized Logging Stack ===
# Loki, Promtail, Grafana, PostgreSQL

services:
  grafana-db:
    image: postgres:14-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_grafana_db
    environment:
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: ${GRAFANA_DATABASE_PASSWORD}
      POSTGRES_DB: grafana
    volumes:
      - grafana_db_data:/var/lib/postgresql/data
    networks:
      - logging_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U grafana" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  grafana:

    image: grafana/grafana:10.3.4
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:8084/
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=grafana-db:5432
      - GF_DATABASE_NAME=grafana
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=${GRAFANA_DATABASE_PASSWORD}
    networks:
      - logging_net
      - soar_net
    ports:
      - "${GRAFANA_PORT:-8084}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    configs:
      - source: grafana_dashboards
        target: /etc/grafana/provisioning/dashboards/grafana-kpi-dashboard.yml
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/grafana-datasources.yml
    restart: unless-stopped
    depends_on:
      grafana-db:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  loki:
    image: grafana/loki:2.9.10
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_loki
    networks:
      - logging_net
    volumes:
      - loki_data:/var/lib/loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  promtail:
    image: grafana/promtail:2.9.9
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_promtail
    command: -config.file=/etc/promtail/config.yml
    networks:
      - logging_net
      - soar_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: promtail_config
        target: /etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

configs:
  promtail_config:
    file: logging/promtail-config.yml
  grafana_datasources:
    file: logging/grafana-datasources.yml
  grafana_dashboards:
    file: logging/grafana-kpi-dashboard.yml
  kpi_dashboard_json:
    file: logging/kpi-dashboard.json

networks:
  logging_net:
    name: logging_net
    external: true
  soar_net:
    name: soar_net
    external: true

volumes:
  grafana_db_data:
  grafana_data:
  loki_data:
