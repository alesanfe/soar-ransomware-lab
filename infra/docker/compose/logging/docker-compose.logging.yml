name: soar-lab-logging

# === Centralized Logging Stack ===
# Loki, Promtail, Grafana, PostgreSQL

services:
  grafana-db:
    image: ${POSTGRES_IMAGE:-postgres:14-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_grafana_db
    environment:
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: ${GRAFANA_DATABASE_PASSWORD}
      POSTGRES_DB: grafana
    volumes:
      - grafana_db_data:/var/lib/postgresql/data
    networks:
      - logging_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U grafana" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:

    image: ${GRAFANA_IMAGE:-grafana/grafana:10.3.4}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      # GRAF-D10: serve HTTPS directly (lab CA) — port 8084 becomes TLS,
      # matching the nginx edge on 8444. Internal consumers verify with ca.crt.
      - GF_SERVER_PROTOCOL=https
      - GF_SERVER_CERT_FILE=/etc/grafana/tls/grafana.crt
      - GF_SERVER_CERT_KEY=/etc/grafana/tls/grafana.key
      - GF_SERVER_ROOT_URL=https://${OUTER_HOSTNAME:-localhost}:${GRAFANA_PORT:-8084}/
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=${GRAFANA_DATABASE_HOST:-grafana-db}:5432
      - GF_DATABASE_NAME=${GRAFANA_DATABASE_NAME:-grafana}
      - GF_DATABASE_USER=${GRAFANA_DATABASE_USER:-grafana}
      - GF_DATABASE_PASSWORD=${GRAFANA_DATABASE_PASSWORD}
      # Image rendering via sidecar
      - GF_RENDERING_SERVER_URL=http://grafana-renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=https://grafana:3000/
      # Optional Keycloak OIDC (AUTH-*): active only when the sso overlay is
      # deployed and GF_OAUTH_ENABLED=true is set in .env.full.
      - GF_AUTH_GENERIC_OAUTH_ENABLED=${GF_OAUTH_ENABLED:-false}
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=soar-proxy
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-soar-lab-oidc-secret}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=http://localhost:${KEYCLOAK_PORT:-8087}/realms/soar/protocol/openid-connect/auth
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=http://keycloak:8080/realms/soar/protocol/openid-connect/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=http://keycloak:8080/realms/soar/protocol/openid-connect/userinfo
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(roles[*], 'platform-admin') && 'Admin' || 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      # "SOAR API" datasource (type=json) needs this community plugin; without
      # it the provisioned datasource fails with "Unable to find datasource plugin".
      - GF_INSTALL_PLUGINS=marcusolsson-json-datasource
      # GRAF-ALERT-RX: the provisioned webhook contact point expands
      # $INTERNAL_SERVICE_TOKEN into the X-Service-Token header.
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    networks:
      - logging_net
      - soar_net
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-8084}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/grafana-datasources.yml:ro
      # GRAF-D10: server cert (+ lab CA for the healthcheck and any backend
      # fetch outside the datasource proxy path).
      - ../config/certs/grafana.crt:/etc/grafana/tls/grafana.crt:ro
      - ../config/certs/grafana.key:/etc/grafana/tls/grafana.key:ro
      - ../config/certs/ca.crt:/etc/grafana/tls/ca.crt:ro
    configs:
      - source: grafana_dashboards
        target: /etc/grafana/provisioning/dashboards/grafana-kpi-dashboard.yml
      - source: kpi_dashboard_json
        target: /etc/grafana/provisioning/dashboards/kpi-dashboard.json
      - source: logs_dashboard_json
        target: /etc/grafana/provisioning/dashboards/logs-dashboard.json
      - source: traces_dashboard_json
        target: /etc/grafana/provisioning/dashboards/traces-dashboard.json
      - source: grafana_alerting
        target: /etc/grafana/provisioning/alerting/alert-rules.yml
      - source: grafana_contacts
        target: /etc/grafana/provisioning/alerting/contact-points.yml
      - source: saturation_dashboard_json
        target: /etc/grafana/provisioning/dashboards/saturation-dashboard.json
    restart: unless-stopped
    depends_on:
      grafana-db:
        condition: service_healthy
      loki:
        condition: service_healthy
      grafana-renderer:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -f --cacert /etc/grafana/tls/ca.crt https://localhost:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # GRAF-D5: S3-compatible object storage for Loki chunks and Tempo
  # blocks — the missing piece vs a production observability stack.
  # SeaweedFS (docker.io/minio/minio is currently pull-restricted);
  # single-node all-in-one (master+volume+filer+s3), autoCreateBucket
  # removes the need for a bucket-init sidecar.
  s3:
    image: ${S3_IMAGE:-chrislusf/seaweedfs:4.53}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_s3
    # GRAF-D5: replicaPlacement 010 — every file gets a second copy on a
    # different rack (s3-vol2 below). Data-level redundancy inside the lab
    # host; the filer/S3 gateway stays single-instance (documented RB-14).
    command: >
      server -dir=/data -ip=s3 -ip.bind=0.0.0.0
      -dataCenter=dc1 -rack=rack1
      -master.defaultReplication=010
      -s3 -s3.port=8333 -s3.autoCreateBucket
      -s3.config=/etc/seaweedfs/iam.config.json
    volumes:
      - s3_data:/data
      - ../config/seaweedfs/iam.config.json:/etc/seaweedfs/iam.config.json:ro
    networks:
      - logging_net
    healthcheck:
      # S3 root returns 403/404 to anonymous probes even when healthy;
      # master /cluster/status + S3 TCP probe are the reliable signals.
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 8333 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Image renderer sidecar for Grafana panel PNG export
  grafana-renderer:
    image: ${GRAFANA_RENDERER_IMAGE:-grafana/grafana-image-renderer:3.10.4}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_grafana_renderer
    # GRAF-D9: default Docker /dev/shm is 64MB — Chromium tabs crash under
    # render bursts (renderer degrades). 512m gives the pool real room.
    shm_size: 512m
    environment:
      # Chromium is RAM-hungry on heavy panels (trace tables); clustered
      # mode keeps a small browser pool so sequential renders do not
      # degrade into ReadTimeouts after ~25 panels (TC-35 render sweep).
      ENABLE_METRICS: "true"
      RENDERING_MODE: "clustered"
      RENDERING_CLUSTERING_MAX_CONCURRENCY: "3"
      RENDERING_CLUSTERING_TIMEOUT: "180"
      # GRAF-D10: callback URL is now https://grafana:3000 with a lab-CA cert
      # that Chromium's NSS store does not know. Rendering is lab-internal
      # traffic — skip upstream cert verification here (the wire is still
      # encrypted; documented in docs/20 RB-13).
      IGNORE_HTTPS_ERRORS: "true"
    networks:
      - logging_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Second volume server on a different rack so placement 010 resolves.
  # Data redundancy (survives a volume-container crash); same host, so it
  # does NOT protect against host/WSL failure — documented limitation.
  s3-vol2:
    image: ${S3_IMAGE:-chrislusf/seaweedfs:4.53}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_s3_vol2
    command: >
      volume -mserver=s3:9333 -ip=s3-vol2 -ip.bind=0.0.0.0
      -port=8081 -dir=/data -max=64
      -dataCenter=dc1 -rack=rack2
    volumes:
      - s3_vol2_data:/data
    networks:
      - logging_net
    depends_on:
      s3:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/status || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot bucket bootstrap (loki chunks + tempo blocks). -s3.autoCreateBucket
  # only materialises a bucket on first PUT; Loki/Tempo LIST first and die
  # with NoSuchBucket, so the buckets are created explicitly via weed shell.
  s3-init:
    image: ${S3_IMAGE:-chrislusf/seaweedfs:4.53}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_s3_init
    entrypoint: >
      /bin/sh -c "
      for b in loki tempo; do
        echo s3.bucket.create -name $$b | weed shell -master=s3:9333 || true;
      done;
      echo 'buckets ready'"
    networks:
      - logging_net
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:2.9.10}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_loki
    # expand-env lets loki-config.yml read ${S3_*} instead of baking
    # credentials into the committed file.
    command: -config.file=/etc/loki/loki-config.yml -config.expand-env=true
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-soar-s3}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-soar-s3-secret-change-me}
    networks:
      - logging_net
      - soar_net
    depends_on:
      s3-init:
        condition: service_completed_successfully
    volumes:
      - loki_data:/var/lib/loki
      - ./logging/loki-config.yml:/etc/loki/loki-config.yml:ro
      # GRAF-D10: internal TLS — cert signed by the lab CA.
      - ../config/certs/loki.crt:/etc/loki/tls/loki.crt:ro
      - ../config/certs/loki.key:/etc/loki/tls/loki.key:ro
    healthcheck:
      # busybox wget cannot pin a CA; --no-check-certificate still exercises
      # the full TLS handshake. Real verification is covered by consumers
      # (promtail/grafana/prometheus) which DO pin the lab CA.
      test: [ "CMD-SHELL", "wget -q --no-check-certificate --spider https://127.0.0.1:3100/ready || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    image: ${PROMTAIL_IMAGE:-grafana/promtail:2.9.9}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_promtail
    command: -config.file=/etc/promtail/config.yml
    networks:
      - logging_net
      - soar_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/config/promtail-config.yml:/etc/promtail/config.yml:ro
      - ../config/certs/ca.crt:/etc/promtail/ca.crt:ro
    depends_on:
      - loki
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9080' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === Distributed tracing (O1) ===
  # API -> otel-collector (OTLP/HTTP :4318) -> Tempo -> Grafana datasource.

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector:0.114.0}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../config/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    networks:
      - logging_net
      - soar_net
    expose:
      - "4318"
      - "4317"
    depends_on:
      tempo:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:2.6.1}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_tempo
    # expand-env injects the S3 credentials into tempo.yaml at boot.
    command: ["-config.file=/etc/tempo.yaml", "-config.expand-env=true"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-soar-s3}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-soar-s3-secret-change-me}
    volumes:
      - ../config/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
      # GRAF-D10: server cert + lab CA (the CA verifies the Prometheus
      # remote_write endpoint, which is also TLS now).
      - ../config/certs/tempo.crt:/etc/tempo/tls/tempo.crt:ro
      - ../config/certs/tempo.key:/etc/tempo/tls/tempo.key:ro
      - ../config/certs/ca.crt:/etc/tempo/tls/ca.crt:ro
    networks:
      - logging_net
    expose:
      - "3200"
      - "4317"
      - "4318"
    depends_on:
      prometheus:
        condition: service_started
      s3-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --no-check-certificate --spider https://127.0.0.1:3200/ready || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === Saturation metrics (GRAF-OBS-02) ===
  # Prometheus scrapes the API /metrics exposition, cAdvisor container
  # stats and the observability backends; Tempo remote-writes derived
  # span/service-graph metrics. Feeds the "SOAR Saturation" dashboard.

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.53.5}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.config.file=/etc/prometheus/web.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=2GB"
      - "--enable-feature=remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ../config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../config/prometheus-web.yml:/etc/prometheus/web.yml:ro
      # GRAF-D10: server cert + lab CA (CA verifies the https scrape
      # targets: loki, tempo, grafana and itself).
      - ../config/certs/prometheus.crt:/etc/prometheus/tls/prometheus.crt:ro
      - ../config/certs/prometheus.key:/etc/prometheus/tls/prometheus.key:ro
      - ../config/certs/ca.crt:/etc/prometheus/ca.crt:ro
      - prometheus_data:/prometheus
    networks:
      - logging_net
      - soar_net
    expose:
      - "9090"
    restart: unless-stopped
    healthcheck:
      # TCP probe: the busybox bundled in prom/prometheus cannot complete a
      # TLS handshake with exporter-toolkit (handshake_failure) — unlike the
      # alpine busybox in loki/tempo. TLS is verified end-to-end anyway: the
      # `prometheus` job scrapes https://prometheus:9090 with ca_file.
      test: [ "CMD-SHELL", "nc -z -w2 127.0.0.1 9090 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.49.1}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - logging_net
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # elasticsearch-exporter exposes cluster health (status, unassigned
  # shards, disk watermarks, heap, rejections) as Prometheus metrics —
  # feeds the ES health panels and alerts (GRAF-029..031).
  elasticsearch-exporter:
    image: ${ES_EXPORTER_IMAGE:-prometheuscommunity/elasticsearch-exporter:v1.7.0}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_elasticsearch_exporter
    command:
      - "--es.uri=http://elasticsearch:9200"
      - "--es.clusterinfo.interval=30s"
      - "--es.timeout=10s"
    environment:
      ES_USERNAME: ${ELASTIC_USERNAME:-elastic}
      ES_PASSWORD: ${ELASTIC_PASSWORD:-}
    networks:
      - logging_net
      - soar_net
    expose:
      - "9114"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:9114/healthz || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

configs:
  grafana_dashboards:
    file: logging/grafana-kpi-dashboard.yml
  kpi_dashboard_json:
    file: logging/kpi-dashboard.json
  logs_dashboard_json:
    file: logging/logs-dashboard.json
  traces_dashboard_json:
    file: logging/traces-dashboard.json
  saturation_dashboard_json:
    file: logging/saturation-dashboard.json
  grafana_alerting:
    file: logging/alert-rules.yml
  grafana_contacts:
    file: logging/grafana-contact-points.yml

networks:
  logging_net:
    name: logging_net
    external: true
  soar_net:
    name: soar_net
    external: true

# GRAF-D6: real named volumes (VM ext4) instead of Windows bind-mounts.
# Hot IO paths (postgres fsync, Loki index/cache, Tempo WAL, Prometheus
# tsdb) get 10-50x lower fsync latency and stop depending on the host
# C:\ drive fill level.
volumes:
  grafana_db_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  tempo_data:
    driver: local
  prometheus_data:
    driver: local
  s3_data:
    driver: local
  s3_vol2_data:
    driver: local
