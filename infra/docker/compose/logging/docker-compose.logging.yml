name: soar-lab-logging

# === Centralized Logging Stack ===
# Loki, Promtail, Grafana, PostgreSQL

services:
  grafana-db:
    image: ${POSTGRES_IMAGE:-postgres:14-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_grafana_db
    environment:
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: ${GRAFANA_DATABASE_PASSWORD}
      POSTGRES_DB: grafana
    volumes:
      - grafana_db_data:/var/lib/postgresql/data
    networks:
      - logging_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U grafana" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:

    image: ${GRAFANA_IMAGE:-grafana/grafana:10.3.4}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://${OUTER_HOSTNAME:-localhost}:${GRAFANA_PORT:-8084}/
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=${GRAFANA_DATABASE_HOST:-grafana-db}:5432
      - GF_DATABASE_NAME=${GRAFANA_DATABASE_NAME:-grafana}
      - GF_DATABASE_USER=${GRAFANA_DATABASE_USER:-grafana}
      - GF_DATABASE_PASSWORD=${GRAFANA_DATABASE_PASSWORD}
      # Image rendering via sidecar
      - GF_RENDERING_SERVER_URL=http://grafana-renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
    networks:
      - logging_net
      - soar_net
    ports:
      - "${GRAFANA_PORT:-8084}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/grafana-datasources.yml:ro
    configs:
      - source: grafana_dashboards
        target: /etc/grafana/provisioning/dashboards/grafana-kpi-dashboard.yml
      - source: kpi_dashboard_json
        target: /etc/grafana/provisioning/dashboards/kpi-dashboard.json
    restart: unless-stopped
    depends_on:
      grafana-db:
        condition: service_healthy
      loki:
        condition: service_healthy
      grafana-renderer:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Image renderer sidecar for Grafana panel PNG export
  grafana-renderer:
    image: ${GRAFANA_RENDERER_IMAGE:-grafana/grafana-image-renderer:3.10.4}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_grafana_renderer
    networks:
      - logging_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:2.9.10}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_loki
    networks:
      - logging_net
      - soar_net
    volumes:
      - loki_data:/var/lib/loki
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    image: ${PROMTAIL_IMAGE:-grafana/promtail:2.9.9}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_promtail
    command: -config.file=/etc/promtail/config.yml
    networks:
      - logging_net
      - soar_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/config/promtail-config.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9080' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

configs:
  grafana_dashboards:
    file: logging/grafana-kpi-dashboard.yml
  kpi_dashboard_json:
    file: logging/kpi-dashboard.json

networks:
  logging_net:
    name: logging_net
    external: true
  soar_net:
    name: soar_net
    external: true

volumes:
  grafana_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/data/grafana_db
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/data/grafana
  loki_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/data/loki
