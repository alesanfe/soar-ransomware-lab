name: soar-lab-hardened

# === Hardened profile — compose override (SOAR-012/013/014/015/016) ===
#
# Opt-in overlay applied AFTER the base files:
#   make up HARDENED=1
# or manually:
#   docker compose -p soar $(all base -f files) \
#       -f infra/docker/compose/docker-compose.hardened.yml --env-file .env up -d
#
# What changes vs the lab profile:
#   * docker-socket-proxy limits Docker API verbs for api + network-watcher +
#     cortex / shuffle-backend / orborus — the spawners go through the proxy
#     too (CONTAINERS/NETWORKS/IMAGES/EXEC whitelisted); raw /var/run/docker.sock
#     mounts are removed via `volumes: !override` for every consumer.
#   * API runs as a non-root UID and has no /var/run/docker.sock mount.
#   * Redis runs as the image's redis user (no entrypoint chown).
#   * Orborus loses seccomp:unconfined -> Docker default seccomp profile.
#   * Global no-new-privileges + cap_drop where the service can tolerate it.
#
# Env vars honoured (set in .env or exported):
#   API_UID / API_GID      numeric UID/GID for the API process (1000:1000)
#   SHUFFLE_OPENSEARCH_SKIPSSL_VERIFY=false   -> enforce TLS verify (needs
#                          a CA OpenSearch trusts; see docs/04-operations.md)
#   SHUFFLE_SWAGGER_ENABLED=false             -> disable Shuffle swagger
#   TENZIR_WEB_MODE=<prod-mode>               -> Tenzir without --mode=dev
#   API_DOCS_ENABLED=false|spec|true          -> API swagger surface
#
# NOTE: !reset requires Docker Compose >= 2.24.

services:
  # --- Restricted Docker API proxy (SOAR-012) ---
  # OBS-EVAL-007: the proxy definition moved to the DEFAULT set
  # (docker-compose.yml) — promtail's docker_sd now routes through it too,
  # and a `depends_on` from a default-set compose cannot resolve a service
  # that only exists in this optional overlay.
  docker-socket-proxy:
    deploy:
      resources:
        limits:
          pids: 128

  api:
    # Non-root user (SOAR-014). docker.sock is gone — Docker API access goes
    # through the restricted proxy via DOCKER_HOST.
    user: "${API_UID:-1000}:${API_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - API_DOCS_ENABLED=${API_DOCS_ENABLED:-spec}
      - API_REQUIRE_AUTH=${API_REQUIRE_AUTH:-true}
      # Hardened rate-limit budgets (lab uses 300/30/60)
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-100}
      - RATE_LIMIT_AUTH_PER_MINUTE=${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      - RATE_LIMIT_CONTAIN_PER_MINUTE=${RATE_LIMIT_CONTAIN_PER_MINUTE:-30}
    volumes: !override
      - ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/results:/app/runtime/results
      - ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/backups:/app/runtime/backups
      - ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/logs:/app/runtime/logs
      - ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/coverage:/app/runtime/coverage
      - ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/data/api:/app/runtime/data
      - ../../../reports/validation/results:/app/reports/validation/results
      - ../../../reports/perf:/app/reports/perf
      - ../../../src:/app/src
      - ../../../tests:/app/tests
      - ../../../scripts:/app/scripts
      - ../../../pytest.ini:/app/pytest.ini
      - ../../../.coveragerc:/app/.coveragerc
      - ../../../bandit.yaml:/app/bandit.yaml
      - ../../../lychee.toml:/app/lychee.toml:ro
      - ../../../pyproject.toml:/app/pyproject.toml
      # Internal CA for TLS verification of lab services (MISP-001).
      - ../../../infra/docker/config/certs/ca.crt:/app/certs/ca.crt:ro
      # certifi+lab-CA bundle for REQUESTS_CA_BUNDLE (external+internal TLS).
      - ../../../infra/docker/config/certs/ca-bundle.crt:/app/certs/ca-bundle.crt:ro
      - ../../../docs:/app/docs:ro
      - ../../../detections:/app/detections
      - ../../../playbooks:/app/playbooks:ro
      - ../../../apps:/app/apps:ro
      - ../../../.env.example:/app/.env.example:ro
      - ../../../.env.container:/app/.env.container:ro
      # Supply-chain gates (tests/architecture/test_supply_chain.py) read
      # workflows + the audited production lock read-only.
      - ../../../.github:/app/.github:ro
      - ../../../requirements.lock:/app/requirements.lock:ro
      - ../../../infra:/app/infra:ro
      # Catalog↔make contract test (tests/contracts/test_tc_catalog.py)
      # needs a Makefile to inspect — the container is Linux.
      - ../../../Makefile.linux:/app/Makefile.linux:ro
      - ../../../Makefile.win:/app/Makefile.win:ro
      # Test-suite gates (tests/architecture/test_test_suite.py) assert the
      # coverage ratchet file exists.
      - ../../../codecov.yml:/app/codecov.yml:ro
    depends_on:
      docker-socket-proxy:
        condition: service_started
    deploy:
      resources:
        limits:
          pids: 256  # uvicorn workers + pytest subprocesses during in-container runs

  api-egress-guard:
    # Zero-trust egress for the api (TC-20): a NET_ADMIN sidecar sharing the
    # api network namespace installs OUTPUT rules that allow private/loopback
    # destinations and DROP everything else. The api image stays hardened —
    # the cap lives only on this minimal sidecar (same pattern as the TC-37
    # netem injector). LAB profile (make up-lab) omits this file entirely.
    image: ${NETSHOOT_IMAGE:-nicolaka/netshoot:v0.14}
    container_name: soar_api_egress_guard
    network_mode: "service:api"
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    read_only: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    command: >-
      sh -c "iptables -N EGRESS_GUARD 2>/dev/null;
             iptables -F EGRESS_GUARD;
             iptables -A EGRESS_GUARD -o lo -j ACCEPT;
             iptables -A EGRESS_GUARD -d 127.0.0.0/8 -j ACCEPT;
             iptables -A EGRESS_GUARD -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT;
             iptables -A EGRESS_GUARD -d 10.0.0.0/8 -j ACCEPT;
             iptables -A EGRESS_GUARD -d 172.16.0.0/12 -j ACCEPT;
             iptables -A EGRESS_GUARD -d 192.168.0.0/16 -j ACCEPT;
             iptables -A EGRESS_GUARD -d 169.254.0.0/16 -j ACCEPT;
             iptables -A EGRESS_GUARD -j DROP;
             iptables -C OUTPUT -j EGRESS_GUARD 2>/dev/null || iptables -I OUTPUT 1 -j EGRESS_GUARD;
             echo 'egress guard installed';
             # E5-03b self-heal: when the api is RECREATED its netns is
             # replaced and this sidecar keeps sleeping on a dead one —
             # rules installed here protect nothing. Sharing the netns
             # means localhost:8000 only answers while the api lives in
             # it; three misses -> exit so 'restart: unless-stopped'
             # re-attaches to the NEW netns and re-installs the rules.
             fails=0;
             while sleep 15; do
               if nc -z 127.0.0.1 8000 2>/dev/null; then fails=0;
               else fails=$$((fails+1));
               fi;
               if [ $$fails -ge 3 ]; then
                 echo 'api netns lost — exiting for reattach'; exit 0;
               fi;
             done"
    healthcheck:
      # E5-03 fail-closed signalling: rules in OUR netns are necessary
      # but not sufficient — the chain persists in a dead netns forever.
      # Also require the api to co-reside (localhost:8000 answering from
      # the shared loopback proves this netns is still the api's).
      test: [ "CMD-SHELL", "iptables -L EGRESS_GUARD -n | grep -q 'DROP.*0.0.0.0/0' && iptables -C OUTPUT -j EGRESS_GUARD && nc -z 127.0.0.1 8000" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          pids: 64  # iptables install + sleep; nothing else ever runs here

  netns-guardian:
    # Self-healing for the netns-sharing sidecars (api-egress-guard,
    # shuffle-backend-tls, shuffle-backend-ingress-guard). `service:<x>`
    # network_mode resolves to `container:<id>` at CREATE time and a plain
    # `docker restart` never re-resolves it — after a backend recreate the
    # sidecar keeps a dead netns and controls silently evaporate. The
    # guardian inspects each pair and clones the stale container with a
    # fresh `container:<name>` reference (same spec, live netns). It needs
    # raw docker.sock (the proxy whitelists GET/POST only; container rm is
    # a DELETE) — it is the sole repair actor, api/watcher stay proxied.
    image: ${NETSHOOT_IMAGE:-nicolaka/netshoot:v0.14}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_netns_guardian
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../../scripts/maintenance/netns_guardian.sh:/guardian/netns_guardian.sh:ro
    command: ["sh", "/guardian/netns_guardian.sh"]
    environment:
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-soar}
      - GUARDIAN_INTERVAL=${GUARDIAN_INTERVAL:-10}
    healthcheck:
      # The loop must still be alive — a crashed guardian silently
      # re-opens the dead-netns class of bug it exists to close.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  network-watcher:
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      # SEC-03 residual: when WATCHER_DOCKER_SOCKET_INJECT=true re-enables the
      # worker socat forward (Cortex DinD flow), it must target the restricted
      # proxy — never the raw daemon socket (worker -> daemon root).
      - DOCKER_PROXY_HOST=docker-socket-proxy
      - DOCKER_PROXY_PORT=2375
      # Zero-trust: hybrid mode alone would accept any "worker-*" name —
      # require the image to match the Shuffle worker/app allowlist too.
      - WATCHER_TRUST_MODE=hybrid
      - WATCHER_MANAGED_IMAGES=${SHUFFLE_WORKER_IMAGE:-soar_shuffle-worker:2.2.1-patched},frikky/shuffle,registry.hub.docker.com/frikky/shuffle,ghcr.io/shuffle
    volumes: !reset []
    depends_on:
      docker-socket-proxy:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          pids: 128
    cap_drop: [ALL]

  redis:
    # Image's redis user instead of root; drop the chown bootstrap (SOAR-014).
    # TLS args duplicated from core.yml — this entrypoint overrides the base.
    user: "redis"
    entrypoint: [ "sh", "-c",
                  "rm -f /data/temp-*.rdb /data/appendonly.aof* 2>/dev/null;
                  exec docker-entrypoint.sh redis-server --requirepass \"$$(cat /run/secrets/redis_password)\"
                  --appendonly no --save \"\" --maxmemory ${REDIS_MAXMEMORY:-768mb}
                  --maxmemory-policy noeviction
                  --port 0 --tls-port 6379
                  --tls-cert-file /etc/redis/tls/redis.crt
                  --tls-key-file /etc/redis/tls/redis.key
                  --tls-ca-cert-file /etc/redis/tls/ca.crt
                  --tls-auth-clients no" ]
    deploy:
      resources:
        limits:
          pids: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  orborus:
    # Drop seccomp:unconfined -> Docker's default seccomp profile (SOAR-013).
    # security_opt is a LIST: plain YAML appends to the base value, so
    # !override is required to actually remove seccomp:unconfined — a plain
    # list silently keeps the unconfined flag (BUG-053 pattern, caught by
    # validate_compose_security.py).
    # If worker spawning breaks, document the failing syscall and ship a
    # custom profile under infra/docker/seccomp/orborus.json instead.
    security_opt: !override
      - no-new-privileges:true
    # SOAR-012: worker spawning goes through the restricted proxy — the raw
    # daemon socket mount is removed. Needs CONTAINERS+POST+IMAGES+NETWORKS+
    # EXEC+EVENTS+INFO+PING (all whitelisted on the proxy).
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    # !override replaces the base list (raw socket removed) — the lab CA
    # mount must be re-added here or OpenSearch TLS verification breaks.
    # NOTE: !reset + list silently drops the entries (same pitfall as the
    # cortex truststore mount) — use !override for a non-empty list.
    volumes: !override
      - ../config/certs/ca.crt:/etc/ssl/certs/lab-ca.crt:ro
    depends_on:
      opensearch:
        condition: service_healthy
      shuffle-backend:
        condition: service_started
      docker-socket-proxy:
        condition: service_started
    deploy:
      resources:
        limits:
          pids: 256

  thehive:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          pids: 1024  # JVM + ES client threads

  cortex:
    security_opt:
      - no-new-privileges:true
    # SOAR-012: analyzer spawning goes through the restricted proxy — raw
    # socket mount removed. The image inlines DOCKER_HOST into the `su -`
    # command (login shell would drop it, see images/cortex/Dockerfile).
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes: !override
      - cortex_data:/var/lib/cortex
      - ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/config/cortex.conf:/etc/cortex/application.conf:ro
      - ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/data/cortex/jobs:/tmp/cortex-jobs
      - ../../../infra/docker/agents/jmx/jmx_prometheus_javaagent-1.0.1.jar:/opt/jmx/jmx-agent.jar:ro
      - ../../../infra/docker/config/jmx-exporter/cortex-jmx.yml:/opt/jmx/cortex-jmx.yml:ro
      - ../../../infra/docker/config/certs/lab-cacerts.jks:/opt/certs/lab-cacerts.jks:ro
      - ../../../infra/docker/config/certs/cortex-keystore.jks:/opt/certs/cortex-keystore.jks:ro
      - ../../../infra/docker/config/certs/ca.crt:/opt/certs/ca.crt:ro
    # Base image declares VOLUME /var/lib/docker (DinD mode) — through the
    # proxy there's no in-container daemon storage; tmpfs overrides the
    # image volume so Docker stops creating a dangling anonymous volume
    # on every recreate.
    tmpfs:
      - /var/lib/docker
    depends_on:
      docker-socket-proxy:
        condition: service_started
    deploy:
      resources:
        limits:
          pids: 1024  # JVM + analyzer subprocess spawner

  # === Runtime hardening sweep (DK-P1-009/010/011/012) ===
  # pids_limit values are calibrated with ~2-4x headroom over steady state
  # (measured via `docker stats` during KPI runs); JVM/indexer services get
  # larger budgets. cap_drop: ALL applies where the image needs no kernel
  # capability — exceptions are documented in security-exceptions.json.

  elasticsearch:
    deploy:
      resources:
        limits:
          pids: 2048  # JVM thread pools
    security_opt:
      - no-new-privileges:true

  opensearch:
    deploy:
      resources:
        limits:
          pids: 2048
    security_opt:
      - no-new-privileges:true

  opensearch-dashboards:
    deploy:
      resources:
        limits:
          pids: 512
    security_opt:
      - no-new-privileges:true

  shuffle-frontend:
    deploy:
      resources:
        limits:
          pids: 128
    security_opt:
      - no-new-privileges:true

  shuffle-backend:
    # SOAR-012: any Docker API use goes through the restricted proxy —
    # raw socket mount removed (env reaches the PID1 Go process directly).
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes: !override
      - shuffle_apps:/shuffle-apps
      - shuffle_files:/shuffle-files
      - ../config/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      opensearch:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    deploy:
      resources:
        limits:
          pids: 512  # Go worker + app runner supervision
    security_opt:
      - no-new-privileges:true

  tenzir-node:
    deploy:
      resources:
        limits:
          pids: 512
    security_opt:
      - no-new-privileges:true

  misp-db:
    deploy:
      resources:
        limits:
          pids: 512  # mariadb
    # MISP-EVAL-008: drop everything, re-add only what the mariadb
    # entrypoint needs (chown datadir + gosu to mysql user).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, FOWNER]
    security_opt:
      - no-new-privileges:true

  misp-modules:
    deploy:
      resources:
        limits:
          pids: 256
    security_opt:
      - no-new-privileges:true

  misp:
    deploy:
      resources:
        limits:
          pids: 1024  # apache + php-fpm + background workers
    security_opt:
      - no-new-privileges:true

  grafana-db:
    deploy:
      resources:
        limits:
          pids: 512  # postgres

  grafana:
    deploy:
      resources:
        limits:
          pids: 256
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=32m

  grafana-renderer:
    deploy:
      resources:
        limits:
          pids: 256
    cap_drop: [ALL]  # renderer runs chrome with --no-sandbox upstream
    read_only: true
    tmpfs:
      - /tmp:size=64m

  loki:
    deploy:
      resources:
        limits:
          pids: 1024  # Go service: goroutines count as PIDs; S3 backend + TLS add
          # I/O workers. Observed slow thread growth under sustained query load
          # (512 exhausted after ~5h of E2E traffic) — 1024 with headroom while
          # keeping a bound; revisit if it leaks beyond this.
    read_only: true
    tmpfs:
      - /tmp:size=64m

  tempo:
    deploy:
      resources:
        limits:
          pids: 2048  # observed ~1.1k steady-state threads (S3 backend + metrics-generator)
    read_only: true
    tmpfs:
      - /tmp:size=64m

  s3:
    deploy:
      resources:
        limits:
          pids: 512  # seaweedfs spawns master+volume+filer+s3 goroutines

  s3-init:
    security_opt:
      - no-new-privileges:true

  promtail:
    deploy:
      resources:
        limits:
          pids: 128
    # OBS-EVAL-007: with the daemon socket gone, root is no longer needed —
    # promtail only reads its :ro config and writes positions to /tmp.
    user: "65534:65534"
    read_only: true
    tmpfs:
      # positions file is ephemeral by design in the lab — a restart re-scans
      # current containers instead of replaying stale offsets
      - /tmp:size=32m,mode=1777

  # OBS-EVAL-001: the six logging services the overlay previously missed —
  # every long-running container gets a process bound (fork-bomb surface).
  prometheus:
    deploy:
      resources:
        limits:
          pids: 512  # Go: one goroutine per scrape target plus tsdb workers
    read_only: true
    tmpfs:
      - /tmp:size=64m

  otel-collector:
    deploy:
      resources:
        limits:
          pids: 128
    read_only: true  # distroless, fully stateless

  cadvisor:
    deploy:
      resources:
        limits:
          pids: 256  # per-container watcher goroutines
    read_only: true  # metrics collector — never writes to its own rootfs

  blackbox-exporter:
    deploy:
      resources:
        limits:
          pids: 128
    # OBS-EVAL-004: image default is root — nothing it does needs it
    # (probes bind unprivileged ports, config mounted :ro).
    user: "65534:65534"
    read_only: true

  elasticsearch-exporter:
    deploy:
      resources:
        limits:
          pids: 64
    read_only: true  # stateless poller

  s3-vol2:
    deploy:
      resources:
        limits:
          pids: 512  # same goroutine profile as s3

  docs-site:
    deploy:
      resources:
        limits:
          pids: 128
    # WEB-EVAL-008: serves :8080 (unprivileged) — run fully as the nginx
    # uid and drop EVERY capability (master==worker uid, no chown/setuid
    # needed; tmpfs dirs are mode=1777 so entrypoint+workers can write).
    user: "101:101"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      # nginx writes its PID + temp paths under /var — keep the read-only
      # root FS and give it a scratch tmpfs (static site, no Docusaurus
      # runtime cache needed anymore).
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=8m,mode=1777
      - /var/tmp:size=8m,mode=1777

  nginx:
    deploy:
      resources:
        limits:
          pids: 128
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE  # master binds :80/:443
      - CHOWN             # entrypoint chowns tmpfs-backed cache dirs
      - SETUID            # master spawns workers that drop to nginx uid/gid
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
      - /tmp:size=16m

  web-management:
    deploy:
      resources:
        limits:
          pids: 128
    # WEB-EVAL-008: moved to listen :8080 — runs fully as the nginx uid
    # with ZERO capabilities (no privileged port, no uid/gid juggling;
    # tmpfs dirs are mode=1777 for entrypoint+worker writes).
    user: "101:101"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # WEB-EVAL-006: same read-only rootfs posture as docs-site/nginx —
    # logs flow via the image's stdout/stderr symlinks, pid+cache+tmp
    # dirs get tmpfs.
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=8m,mode=1777
      - /tmp:size=16m,mode=1777
      - /var/tmp:size=8m,mode=1777

  # NOTE (OBS-EVAL-006): hardened keys for OPTIONAL stacks (sso, taxii)
  # live in their own compose files — the default `make up` set does not
  # include those overlays, and referencing image-less services here made
  # `docker compose config` fail on the default set (verified live).
