name: soar-lab-core

# === Core SOAR Services ===
# Redis, TheHive, Cortex, Shuffle
# (Elasticsearch is in docker-compose.yml)

services:
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_redis
    user: root
    entrypoint: [ "sh", "-c", "chown -R redis:redis /data && rm -f /data/temp-*.rdb /data/appendonly.aof* && exec docker-entrypoint.sh redis-server --requirepass \"${REDIS_PASSWORD}\" --appendonly no --save \"\"" ]
    command: [ ]
    volumes:
      - redis_data:/data
    networks:
      - ti_net
      - soar_net
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 6379 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  thehive:
    image: thehiveproject/thehive:3.5.2-1
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_thehive
    depends_on:
      elasticsearch:
        condition: service_started
    ports:
      - "${THEHIVE_HTTP_PORT:-9000}:9000"
    volumes:
      - thehive_files:/opt/thp/thehive/files
      - ../thehive.application.conf/thehive.conf:/etc/thehive/application.conf:ro
    networks:
      - soar_net
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/api/status || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cortex:
    build:
      context: ../cortex
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_cortex
    depends_on:
      elasticsearch:
        condition: service_started
    ports:
      - "${CORTEX_HTTP_PORT:-19001}:9001"
    volumes:
      - cortex_data:/var/lib/cortex
      - ../cortex.application.conf/cortex.conf:/etc/cortex/application.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - soar_net
    healthcheck:
      test: [ "CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' http://localhost:9001/ | grep -qE '^[23]' || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  shuffle-frontend:
    image: ghcr.io/shuffle/shuffle-frontend:2.2.1
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_shuffle_frontend
    ports:
      - "${SHUFFLE_UI_PORT:-8081}:80"
    environment:
      BACKEND_HOSTNAME: shuffle-backend
      SHUFFLE_APP_HOTLOAD_FOLDER: /shuffle-apps
    networks:
      - soar_net
      - ti_net
    depends_on:
      shuffle-backend:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:80 || exit 1" ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  shuffle-backend:
    image: ghcr.io/shuffle/shuffle-backend:2.2.1
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_shuffle_backend
    environment:
      SHUFFLE_ELASTIC: "true"
      SHUFFLE_OPENSEARCH_URL: http://elasticsearch:9200
      SHUFFLE_OPENSEARCH_SKIPSSL_VERIFY: "true"
      SHUFFLE_OPENSEARCH_USERNAME: ${ELASTIC_USERNAME:-elastic}
      SHUFFLE_OPENSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
      OUTER_HOSTNAME: ${OUTER_HOSTNAME:-host.docker.internal}
      SHUFFLE_APP_HOTLOAD_FOLDER: /shuffle-apps
      SHUFFLE_FILE_LOCATION: /shuffle-files
      SHUFFLE_APP_DOWNLOAD_LOCATION: ${SHUFFLE_APP_DOWNLOAD_LOCATION:-https://github.com/shuffle/python-apps}
      SHUFFLE_APP_FORCE_UPDATE: "true"
      SHUFFLE_DEFAULT_USERNAME: ${SHUFFLE_DEFAULT_USERNAME:-admin}
      SHUFFLE_DEFAULT_PASSWORD: ${SHUFFLE_DEFAULT_PASSWORD:-ShuffleLab2024Secure}
      SHUFFLE_DEFAULT_APIKEY: ${SHUFFLE_DEFAULT_APIKEY:-f2a8b3c9-d4e1-5f6a-7b8c-9d0e1f2a3b4c}
      SHUFFLE_SWAGGER_ENABLED: "true"
      SHUFFLE_AUTH_MODE: "multi"
      SHUFFLE_HEALTHCHECK_DISABLED: "false"
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-1.45}
    volumes:
      - shuffle_apps:/shuffle-apps
      - shuffle_files:/shuffle-files
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${SHUFFLE_API_PORT:-15001}:5001"
    networks:
      - soar_net
      - ti_net
    depends_on:
      elasticsearch:
        condition: service_started
    healthcheck:
      disable: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  network-watcher:
    build: network-watcher
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_network_watcher
    environment:
      TARGET_NETWORK: ${COMPOSE_PROJECT_NAME:-soar}_soar_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - soar_net
    restart: unless-stopped

  tenzir-node:
    image: tenzir/tenzir:main
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_tenzir_node
    entrypoint: [ "tenzir-node" ]
    command: [ "--commands=web server --mode=dev --bind=0.0.0.0" ]
    ports:
      - "15160:5160"
      - "15140:1514"
    networks:
      - soar_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  orborus:
    image: ghcr.io/shuffle/shuffle-orborus:2.2.1
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_orborus
    environment:
      SHUFFLE_APP_SDK_TIMEOUT: 300
      SHUFFLE_ORBORUS_EXECUTION_CONCURRENCY: "5"
      ENVIRONMENT_NAME: ${SHUFFLE_ENV_NAME:-Shuffle}
      ORG_ID: ${SHUFFLE_ORG_ID:-Shuffle}
      BASE_URL: http://soar_shuffle_backend:5001
      SHUFFLE_OPENSEARCH_URL: http://elasticsearch:9200
      EXECUTION_ENVIRONMENT: docker
      SHUFFLE_APP_SDK_URL: "https://github.com/shuffle/python-apps"
      SHUFFLE_STATS_DISABLED: true
      SHUFFLE_LOGS_DISABLED: true
      SHUFFLE_SWARM_CONFIG: docker
      CLEANUP: true
      SHUFFLE_WORKER_IMAGE: ghcr.io/shuffle/shuffle-worker:2.2.1
      SHUFFLE_PIPELINE_AUTH: ${SHUFFLE_DEFAULT_APIKEY:-f2a8b3c9-d4e1-5f6a-7b8c-9d0e1f2a3b4c}
      SHUFFLE_PIPELINE_URL: http://tenzir-node:5160
      SHUFFLE_APP_NETWORK: ${COMPOSE_PROJECT_NAME:-soar}_soar_net
      ORBORUS_CONTAINER_NAME: ${COMPOSE_PROJECT_NAME:-soar}_orborus
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - soar_net
    depends_on:
      elasticsearch:
        condition: service_started
      shuffle-backend:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "nc -z shuffle-backend 5001 || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
