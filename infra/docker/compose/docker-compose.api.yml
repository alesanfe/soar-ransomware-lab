name: soar-lab-api

# === API Service, Documentation, Web Management, Nginx ===

services:
  api:
    build:
      context: ../../../
      dockerfile: apps/api/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_api
    environment:
      - FASTAPI_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=${CORS_ORIGINS:-"http://localhost:8086,http://localhost,http://localhost:8081"}
      - LOG_LEVEL=${API_LOG_LEVEL:-INFO}
      - AUTH_SECRET_KEY=${API_AUTH_SECRET}
      - API_AUTH_SECRET=${API_AUTH_SECRET}
      - WEB_UI_USER=${WEB_UI_USER:-admin}
      - WEB_UI_PASSWORD=${WEB_UI_PASSWORD}
      - DOCKER_COMPOSE_FILE=docker-compose.yml
      - TEST_RESULTS_DIR=/app/runtime/results
      - BACKUP_DIR=/app/runtime/backups
      - REDIS_URL=rediss://:${REDIS_PASSWORD}@redis:6379/0?ssl_cert_reqs=required&ssl_ca_certs=/app/certs/ca.crt
      - PYTHONPATH=/app/src
      - BASE_DIR=/app
      - THEHIVE_ADMIN_USER=${THEHIVE_ADMIN_USER:-admin}
      - THEHIVE_ADMIN_PASSWORD=${THEHIVE_ADMIN_PASSWORD}
      - THEHIVE_SECRET=${THEHIVE_SECRET}
      - THEHIVE_API_KEY=${THEHIVE_API_KEY}
      - CORTEX_ADMIN_USER=${CORTEX_ADMIN_USER:-admin}
      - CORTEX_ADMIN_PASSWORD=${CORTEX_ADMIN_PASSWORD}
      - CORTEX_SECRET=${CORTEX_SECRET}
      - CORTEX_API_KEY=${CORTEX_API_KEY}
      # CORE-SEC-003: needed by init_shuffle_webhook to render the
      # X-Tenzir-Token header into the workflow's Tenzir actions.
      - TENZIR_TOKEN=${TENZIR_TOKEN:-}
      - SHUFFLE_DEFAULT_USERNAME=${SHUFFLE_DEFAULT_USERNAME:-admin}
      - SHUFFLE_DEFAULT_PASSWORD=${SHUFFLE_DEFAULT_PASSWORD}
      - SHUFFLE_DEFAULT_APIKEY=${SHUFFLE_DEFAULT_APIKEY}
      - MISP_ADMIN_EMAIL=${MISP_ADMIN_EMAIL:-admin@soar.local}
      - MISP_ADMIN_PASSWORD=${MISP_ADMIN_PASSWORD}
      # MISP-EVAL-013: integration key — Publisher role (least privilege);
      # falls back to the admin key for setups that have not migrated.
      - MISP_API_KEY=${MISP_AUTOMATION_API_KEY:-${MISP_API_KEY}}
      - MISP_URL=${MISP_URL:-https://misp}
      # TAXII feed (optional overlay) — e2e tests auth against it
      - TAXII_READER_PASS=${TAXII_READER_PASS:-}
      - TAXII_WRITER_PASS=${TAXII_WRITER_PASS:-}
      - SIEM_WEBHOOK_TOKEN=${SIEM_WEBHOOK_TOKEN}
      - EDR_SIM_TOKEN=${EDR_SIM_TOKEN}
      - FIREWALL_SIM_TOKEN=${FIREWALL_SIM_TOKEN}
      - ELASTIC_USERNAME=${ELASTIC_USERNAME:-elastic}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Distributed tracing (O1) — disabled by default; set OTEL_ENABLED=1
      # to export spans to the otel-collector in the logging stack.
      - OTEL_ENABLED=${OTEL_ENABLED:-0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-soar-api}
      # Bulkhead isolation (RES-03) — per-integration / global outbound caps
      - SOAR_BULKHEAD_CONCURRENT=${SOAR_BULKHEAD_CONCURRENT:-10}
      - SOAR_BULKHEAD_QUEUED=${SOAR_BULKHEAD_QUEUED:-50}
      - SOAR_BULKHEAD_TIMEOUT=${SOAR_BULKHEAD_TIMEOUT:-5}
      - SOAR_BULKHEAD_GLOBAL=${SOAR_BULKHEAD_GLOBAL:-64}
      - SOAR_BULKHEAD_GLOBAL_QUEUE=${SOAR_BULKHEAD_GLOBAL_QUEUE:-256}
      # Service health check URLs (derived from service URL env vars)
      - THEHIVE_HEALTH_URL=${THEHIVE_URL:-https://thehive:9443}/api/v1/status/public
      - THEHIVE_CONTAINER=${COMPOSE_PROJECT_NAME:-soar}_thehive
      - CORTEX_HEALTH_URL=${CORTEX_URL:-https://cortex:9443}/
      - CORTEX_CONTAINER=${COMPOSE_PROJECT_NAME:-soar}_cortex
      - SHUFFLE_UI_HEALTH_URL=http://shuffle-frontend:80
      - SHUFFLE_FRONTEND_CONTAINER=${COMPOSE_PROJECT_NAME:-soar}_shuffle_frontend
      - SHUFFLE_HEALTH_URL=${SHUFFLE_BACKEND_URL:-https://shuffle-backend:5443}/api/v1/health
      - SHUFFLE_CONTAINER=${COMPOSE_PROJECT_NAME:-soar}_shuffle_backend
      - OPENSEARCH_DASHBOARDS_HEALTH_URL=http://opensearch-dashboards:5601/api/status
      - OPENSEARCH_DASHBOARDS_CONTAINER=${COMPOSE_PROJECT_NAME:-soar}_opensearch_dashboards
      - DOCS_HEALTH_URL=http://docs-site:8080
      - DOCS_CONTAINER=${COMPOSE_PROJECT_NAME:-soar}_docs_site
      - API_HEALTH_URL=${API_URL:-http://api:8000}/health
      - API_CONTAINER=${COMPOSE_PROJECT_NAME:-soar}_api
      - ELASTICSEARCH_HEALTH_URL=https://${ELASTIC_USERNAME:-elastic}:${ELASTIC_PASSWORD}@elasticsearch:9200/_cluster/health
      - OPENSEARCH_HEALTH_URL=https://${OPENSEARCH_USERNAME:-admin}:${OPENSEARCH_PASSWORD}@opensearch:9200/_cluster/health
      # Combined CA bundle (certifi + lab CA) so requests-based clients
      # verify lab TLS without breaking external HTTPS.
      - REQUESTS_CA_BUNDLE=/app/certs/ca-bundle.crt
      - ELASTICSEARCH_CONTAINER=${COMPOSE_PROJECT_NAME:-soar}_elasticsearch
      - NGINX_HEALTH_URL=http://nginx/nginx-health
      - NGINX_CONTAINER=${COMPOSE_PROJECT_NAME:-soar}_nginx
      # MISP serves HTTPS with a self-signed lab cert; heartbeat lives on :443
      # (http://misp:80 301-redirects and an HTTP GET to Redis (RESP) fails).
      - MISP_HEALTH_URL=${MISP_HEALTH_URL:-https://misp:443/users/heartbeat}
      - MISP_VERIFY_TLS=${MISP_VERIFY_TLS:-false}
      # Grafana serves HTTPS with the lab CA (mounted at /app/certs/ca.crt).
      # Needed by e2e report generation (dashboard export, panel rendering).
      - GRAFANA_URL=${GRAFANA_URL:-https://grafana:3000}
      - GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GRAFANA_API_KEY=${GRAFANA_API_KEY:-}
      - LOKI_URL=${LOKI_URL:-https://loki:3100}
      # S3 credentials exposed for the observability live tests
      # (test_bucket_scoping_enforced proves least-privilege via SigV4).
      - LOKI_S3_ACCESS_KEY=${LOKI_S3_ACCESS_KEY:-}
      - LOKI_S3_SECRET_KEY=${LOKI_S3_SECRET_KEY:-}
      - REDIS_HEALTH_URL=${REDIS_HEALTH_URL:-tcp://redis:6379}
      - ES_URL=${ELASTICSEARCH_URL:-https://elasticsearch:9200}
      - SHUFFLE_OPENSEARCH_URL=${SHUFFLE_OPENSEARCH_URL:-https://opensearch:9200}
      - SHUFFLE_OPENSEARCH_USERNAME=${OPENSEARCH_USERNAME:-admin}
      - SHUFFLE_OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
      - SHUFFLE_OPENSEARCH_VERIFY_TLS=${SHUFFLE_OPENSEARCH_VERIFY_TLS:-true}
      - THEHIVE_URL=${THEHIVE_URL:-https://thehive:9443}
      # API hardening (SOAR-010/011/017)
      # Secure-by-default: auth is REQUIRED unless API_REQUIRE_AUTH=false is
      # set explicitly (insecure mode is never used by CI).
      - API_REQUIRE_AUTH=${API_REQUIRE_AUTH:-true}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
      # AUTH-002 scoped service identities — consumed by workflow nodes
      # (cache/ioc, containment, callback) and embedded at init-webhook time.
      - CONTAINMENT_SERVICE_TOKEN=${CONTAINMENT_SERVICE_TOKEN:-}
      - CACHE_SERVICE_TOKEN=${CACHE_SERVICE_TOKEN:-}
      - CALLBACK_SERVICE_TOKEN=${CALLBACK_SERVICE_TOKEN:-}
      # Real containment (VAL-010): when 1, POST /api/v1/contain with
      # mode=enforce disconnects/pauses the allowlisted victim container.
      - SOAR_CONTAIN_ENFORCE=${SOAR_CONTAIN_ENFORCE:-0}
      - SOAR_CONTAIN_ALLOW_PREFIX=${SOAR_CONTAIN_ALLOW_PREFIX:-victim_}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-300}
      - RATE_LIMIT_AUTH_PER_MINUTE=${RATE_LIMIT_AUTH_PER_MINUTE:-30}
      - RATE_LIMIT_CONTAIN_PER_MINUTE=${RATE_LIMIT_CONTAIN_PER_MINUTE:-60}
      - RATE_LIMIT_BACKEND=${RATE_LIMIT_BACKEND:-memory}
      - WS_TICKET_BACKEND=${WS_TICKET_BACKEND:-memory}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
      - API_DOCS_ENABLED=${API_DOCS_ENABLED:-true}
    volumes:
      - ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/results:/app/runtime/results
      - ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/backups:/app/runtime/backups
      - ${RUNTIME_DIR:-${ARTIFACTS_DIR:-../../../runtime}}/logs:/app/runtime/logs
      - ../../../reports/validation/results:/app/reports/validation/results
      - ../../../reports/perf:/app/reports/perf
      - ../../../src:/app/src
      - ../../../tests:/app/tests
      - ../../../scripts:/app/scripts
      - ../../../pytest.ini:/app/pytest.ini
      - ../../../.coveragerc:/app/.coveragerc
      - ../../../bandit.yaml:/app/bandit.yaml
      - ../../../lychee.toml:/app/lychee.toml:ro
      - ../../../pyproject.toml:/app/pyproject.toml
      # Internal CA for TLS verification of lab services (MISP-001).
      - ../../../infra/docker/config/certs/ca.crt:/app/certs/ca.crt:ro
      - ../../../infra/docker/config/certs/ca-bundle.crt:/app/certs/ca-bundle.crt:ro
      - ../../../docs:/app/docs:ro
      - ../../../detections:/app/detections
      # Committed workflow playbook snapshots (tests/unit/quality/*playbook*)
      - ../../../playbooks:/app/playbooks:ro
      # App Dockerfiles/nginx confs asserted by tests/unit/infra/*
      - ../../../apps:/app/apps:ro
      - ../../../.env.example:/app/.env.example:ro
      # Supply-chain gates (tests/architecture/test_supply_chain.py) read
      # workflows + the audited production lock read-only.
      - ../../../.github:/app/.github:ro
      - ../../../requirements.lock:/app/requirements.lock:ro
      # Catalog↔make contract test (tests/contracts/test_tc_catalog.py)
      # needs a Makefile to inspect — the container is Linux.
      - ../../../Makefile.linux:/app/Makefile.linux:ro
      - ../../../Makefile.win:/app/Makefile.win:ro
      # Test-suite gates (tests/architecture/test_test_suite.py) assert the
      # coverage ratchet file exists.
      - ../../../codecov.yml:/app/codecov.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Container-facing env snapshot (generated by build_local_env.py).
      # `.env.full` is intentionally NOT mounted (SOAR-018).
      - ../../../.env.container:/app/.env.container:ro
      - ../../../infra:/app/infra:ro
    # DS-001: bounded scratch filesystem for real ENOSPC fault injection.
    tmpfs:
      - /ds001:size=48m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: root
    ports:
      # WEB-TLS-006: loopback only — the API must not be reachable from
      # other hosts on the LAN; nginx is the public edge for remote access.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      - soar_net
      - ti_net
      - logging_net
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  docs-site:
    # DOCS-001/002: static build — `docusaurus build` at image time, nginx
    # serves plain HTML. No dev server, no webpack at runtime; docs are
    # baked into the image (rebuild `make build-docs` to refresh content).
    build:
      context: ../../../
      dockerfile: apps/docs-site/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_docs_site
    ports:
      - "127.0.0.1:${DOCS_PORT:-8086}:8080"
    networks:
      - soar_net
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/soar-ransomware-lab/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          # Static nginx — the old webpack dev server needed 2G.
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web-management:
    build:
      context: ../../../apps/web-management
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_web_management
    ports:
      - "127.0.0.1:${WEB_UI_PORT:-8085}:8080"
    networks:
      - soar_net
    healthcheck:
      # WEB-EVAL-005: app-level probe — nginx /health returns 200 only when
      # the worker actually serves (pgrep reports healthy with a dead
      # config upstream, same class as MISP-EVAL-001).
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-soar}_nginx
    volumes:
      - ../config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../config/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      # WEB-EVAL-009: loopback-bound like every other published port in the
      # lab — without it the edge exposes TheHive/Cortex/Shuffle/UI auth
      # surfaces to the LAN (verified live: 0.0.0.0:80/443 listening).
      - "127.0.0.1:${HTTP_PORT:-80}:80"
      - "127.0.0.1:${HTTPS_PORT:-443}:443"
      # GRAF-D10: Grafana sobre TLS (proxy a grafana:3000)
      - "127.0.0.1:${GRAFANA_TLS_PORT:-8444}:8444"
    networks:
      soar_net:
        aliases:
          # TLS cert is issued for soar.local (SAN) — the alias lets
          # in-cluster clients verify by the served name.
          - soar.local
      logging_net:
    depends_on:
      thehive:
        condition: service_healthy
      cortex:
        condition: service_healthy
      shuffle-frontend:
        condition: service_healthy
      web-management:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
