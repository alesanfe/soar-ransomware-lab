global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'elasticsearch'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['elasticsearch-exporter:9114']

  - job_name: 'redis'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'grafana'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'thehive'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['thehive-metrics:80']

  - job_name: 'cortex'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cortex-metrics:80']
