events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=30s;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers (global)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Proxy common settings
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;

    # Upstream services
    upstream thehive {
        server thehive:9000;
    }

    upstream cortex {
        server cortex:9001;
    }

    upstream shuffle {
        server shuffle-frontend:80;
    }

    upstream shuffle-api {
        server shuffle-backend:5001;
    }

    upstream kibana {
        server kibana:5601;
    }

    upstream api {
        server api:8000;
    }

    upstream misp {
        server misp:80;
    }

    upstream web-management {
        server web-management:80;
    }

    upstream grafana {
        server grafana:3000;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost soar.local;

        # Health check (accesible por HTTP para Docker healthcheck)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Redirigir todo lo demás a HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS principal ───────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name localhost soar.local;

        ssl_certificate     /etc/nginx/ssl/soar.local.crt;
        ssl_certificate_key /etc/nginx/ssl/soar.local.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

        # ── Web Management Dashboard (raíz) ───────────────────────────────────
        location / {
            proxy_pass http://web-management;
            location = /index.html {
                proxy_pass http://web-management/index.html;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }
        }

        # ── TheHive ───────────────────────────────────────────────────────────
        location /thehive/ {
            rewrite ^/thehive/(.*)$ /$1 break;
            proxy_pass http://thehive;
            proxy_redirect ~^/(.*)$ /thehive/$1;
        }

        # ── Cortex ────────────────────────────────────────────────────────────
        location /cortex/ {
            rewrite ^/cortex/(.*)$ /$1 break;
            proxy_pass http://cortex;
            proxy_redirect ~^/(.*)$ /cortex/$1;
        }

        # ── Shuffle UI ────────────────────────────────────────────────────────
        # SPA con rutas absolutas (/assets/, /manifest.json) — no se puede
        # proxy bajo subpath sin recompilar. Acceder en http://localhost:3001
        # location /shuffle/ { ... }  deshabilitado

        # ── Shuffle API (webhook) ─────────────────────────────────────────────
        location /shuffle-api/ {
            rewrite ^/shuffle-api/(.*)$ /$1 break;
            proxy_pass http://shuffle-api;
        }

        # ── Kibana ────────────────────────────────────────────────────────────
        # Sin rewrite: Kibana tiene SERVER_BASEPATH=/kibana, espera el prefijo
        location /kibana/ {
            proxy_pass http://kibana/kibana/;
        }

        # ── MISP ──────────────────────────────────────────────────────────────
        location /misp/ {
            rewrite ^/misp/(.*)$ /$1 break;
            proxy_pass http://misp;
        }

        # ── Lab API ───────────────────────────────────────────────────────────
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api;
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Credentials "true" always;
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # ── Documentación ─────────────────────────────────────────────────────
        # docs-site es una SPA con rutas absolutas — servida en puerto 3002
        # location /docs/ { ... }  deshabilitado

        # ── Grafana ───────────────────────────────────────────────────────────
        # Sin rewrite: Grafana tiene GF_SERVER_SERVE_FROM_SUB_PATH=true
        location /grafana/ {
            proxy_pass http://grafana/grafana/;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # ── Docs HTTPS (puerto dedicado — SPA con rutas absolutas) ──────────────────
    server {
        listen 3000 ssl;
        server_name localhost soar.local;

        ssl_certificate     /etc/nginx/ssl/soar.local.crt;
        ssl_certificate_key /etc/nginx/ssl/soar.local.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            set $docs_upstream http://docs-site:3000;
            proxy_pass $docs_upstream;
        }
    }

    # ── Shuffle HTTPS (puerto dedicado — SPA con rutas absolutas) ─────────────
    server {
        listen 3001 ssl;
        server_name localhost soar.local;

        ssl_certificate     /etc/nginx/ssl/soar.local.crt;
        ssl_certificate_key /etc/nginx/ssl/soar.local.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /api/ {
            proxy_pass         http://shuffle-api/api/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://shuffle;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
