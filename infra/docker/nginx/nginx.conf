events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=30s;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers (global)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Proxy common settings
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost soar.local;

        # Health check (accesible por HTTP para Docker healthcheck)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Redirigir todo lo demás a HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS principal ───────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name localhost soar.local;

        ssl_certificate     /etc/nginx/ssl/soar.local.crt;
        ssl_certificate_key /etc/nginx/ssl/soar.local.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

        # ── Web Management Dashboard (raíz) ───────────────────────────────────
        location / {
            set $upstream_web web-management:80;
            proxy_pass http://$upstream_web;
            location = /index.html {
                set $upstream_web_index web-management:80;
                proxy_pass http://$upstream_web_index/index.html;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }
        }

        # ── TheHive ───────────────────────────────────────────────────────────
        location /thehive/ {
            rewrite ^/thehive/(.*)$ /$1 break;
            proxy_pass http://thehive:9000;
            proxy_redirect ~^/(.*)$ /thehive/$1;
        }

        # ── Cortex ────────────────────────────────────────────────────────────
        location /cortex/ {
            rewrite ^/cortex/(.*)$ /$1 break;
            proxy_pass http://cortex:9001;
            proxy_redirect ~^/(.*)$ /cortex/$1;
        }

        # ── Shuffle UI ────────────────────────────────────────────────────────
        # SPA con rutas absolutas (/assets/, /manifest.json) — no se puede
        # proxy bajo subpath sin recompilar. Acceder en http://localhost:8081
        # location /shuffle/ { ... }  deshabilitado

        # ── Shuffle API (webhook) ─────────────────────────────────────────────
        location /shuffle-api/ {
            rewrite ^/shuffle-api/(.*)$ /$1 break;
            set $upstream_shuffle shuffle-backend:5001;
            proxy_pass http://$upstream_shuffle;
        }

        # ── Kibana ────────────────────────────────────────────────────────────
        # Sin rewrite: Kibana tiene SERVER_BASEPATH=/kibana, espera el prefijo
        location /kibana/ {
            set $upstream_kibana kibana:5601;
            proxy_pass http://$upstream_kibana/kibana/;
        }

        # ── MISP ──────────────────────────────────────────────────────────────
        # MISP no soporta subpath proxy — acceder en https://localhost:8082

        # ── Lab API ───────────────────────────────────────────────────────────
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api:8000;
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Credentials "true" always;
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # ── Documentación ─────────────────────────────────────────────────────
        # docs-site es una SPA con rutas absolutas — acceder en http://localhost:8086

        # ── Grafana ───────────────────────────────────────────────────────────
        # Acceso directo en http://localhost:8084

        # ── Health check ──────────────────────────────────────────────────────
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

}
