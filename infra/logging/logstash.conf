input {
  beats {
    port => 5044
  }
  tcp {
    port => 5000
    codec => json_lines
  }
  udp {
    port => 5001
    codec => json_lines
  }
}

filter {
  # Parse SOAR application logs
  if [fields][service] == "soar-app" {
    json {
      source => "message"
    }
    
    # Add service metadata
    mutate {
      add_field => { "[@metadata][service]" => "soar-app" }
    }
  }
  
  # Parse Docker container logs
  if [docker][container] {
    mutate {
      add_field => { "[@metadata][container]" => "%{[docker][container][name]}" }
    }
  }
  
  # Parse Python application logs
  if [logger_name] {
    mutate {
      add_field => { "[@metadata][logger]" => "%{logger_name}" }
    }
  }
  
  # Add timestamp processing
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }
  
  # Parse alert logs
  if [event_type] == "ransomware_detection" {
    mutate {
      add_field => { "[@metadata][event_type]" => "ransomware_alert" }
      add_tag => ["security", "alert"]
    }
    
    # Extract severity level
    if [severity] {
      mutate {
        add_field => { "[@metadata][severity]" => "%{severity}" }
      }
    }
  }
  
  # Parse error logs
  if [level] == "ERROR" or [level] == "CRITICAL" {
    mutate {
      add_tag => ["error", "critical"]
    }
  }
  
  # Parse performance logs
  if [response_time_ms] {
    mutate {
      add_field => { "[@metadata][performance]" => "true" }
      add_tag => ["performance"]
    }
    
    # Convert response time to seconds for better querying
    ruby {
      code => "event['response_time_s'] = event['response_time_ms'].to_f / 1000.0"
    }
  }
  
  # Add geographic location for IP addresses
  if [src_ip] and [src_ip] =~ /^\d+\.\d+\.\d+\.\d+$/ {
    geoip {
      source => "src_ip"
      target => "geoip"
    }
  }
  
  # Parse MITRE ATT&CK information
  if [mitre_tactics] or [mitre_techniques] {
    mutate {
      add_field => { "[@metadata][mitre]" => "true" }
      add_tag => ["mitre", "threat_intel"]
    }
  }
  
  # Cleanup and normalize fields
  mutate {
    remove_field => ["host", "agent", "ecs", "input", "log"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "soar-logs-%{+YYYY.MM.dd}"
    template_name => "soar-logs"
    template_pattern => "soar-logs-*"
    template => {
      "index_patterns" => ["soar-logs-*"],
      "settings" => {
        "number_of_shards" => 1,
        "number_of_replicas" => 0,
        "index.refresh_interval" => "5s"
      },
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" },
          "@metadata" => {
            "properties" => {
              "service" => { "type" => "keyword" },
              "container" => { "type" => "keyword" },
              "logger" => { "type" => "keyword" },
              "event_type" => { "type" => "keyword" },
              "severity" => { "type" => "keyword" },
              "performance" => { "type" => "boolean" },
              "mitre" => { "type" => "boolean" }
            }
          },
          "alert_id" => { "type" => "keyword" },
          "hostname" => { "type" => "keyword" },
          "src_ip" => { "type" => "ip" },
          "severity" => { "type" => "keyword" },
          "event_type" => { "type" => "keyword" },
          "description" => { "type" => "text" },
          "response_time_ms" => { "type" => "float" },
          "response_time_s" => { "type" => "float" },
          "mitre_tactics" => { "type" => "keyword" },
          "mitre_techniques" => { "type" => "keyword" },
          "geoip" => {
            "properties" => {
              "location" => { "type" => "geo_point" },
              "country_name" => { "type" => "keyword" },
              "city_name" => { "type" => "keyword" }
            }
          },
          "tags" => { "type" => "keyword" }
        }
      }
    }
  }
  
  # Debug output (remove in production)
  stdout {
    codec => rubydebug
  }
}
