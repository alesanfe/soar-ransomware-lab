server {
    # WEB-EVAL-008: unprivileged port — the container runs fully as the
    # nginx uid with zero capabilities (same posture as docs-site).
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # WEB-EVAL-001: hide nginx version banner (same as docs-site).
    server_tokens off;

    # WEB-EVAL-002: Docker DNS for dynamic upstream resolution — without a
    # variable, proxy_pass resolves api:8000 once at startup and goes stale
    # on api recreates (same pattern as the edge nginx.conf).
    resolver 127.0.0.11 valid=30s;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers — repeated per location because any location-level
    # add_header suppresses inheritance of ALL server-level add_header
    # directives (nginx semantics).
    # WEB-EVAL-003: X-XSS-Protection dropped (deprecated; CSP supersedes it),
    # Referrer-Policy tightened to no-referrer, Permissions-Policy added —
    # aligned with docs-site.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # WEB-EVAL-004: proxy /api to the lab API — required for the UI to
    # authenticate/stream when reached directly (:8085) or via the SSO
    # oauth2-proxy (:8088, upstream = web-management:80). Without this,
    # /api requests 405'd against the static root (login dead on 2 of 3
    # entry paths; only the edge :8443 routed them).
    # /api/v1/* routes are registered in FastAPI WITH the /api prefix —
    # pass them unmodified; other /api/* paths strip the prefix (mirrors
    # the edge nginx semantics so all three doors behave identically).
    location /api/v1/ {
        set $upstream_api_v1 api:8000;
        proxy_pass http://$upstream_api_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location /api/ws/ {
        set $upstream_api_ws api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_api_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;  # WS streams are long-lived
    }

    location /api/ {
        set $upstream_api api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # Handle static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    # Prevent caching of index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }

    # Handle main application
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
