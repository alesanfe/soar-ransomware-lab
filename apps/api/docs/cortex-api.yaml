openapi: 3.0.3
info:
  title: Cortex API
  description: Security analysis platform for observable enrichment and automation
  version: 5.1.0
  contact:
    name: Cortex Project
servers:
  - url: http://localhost:9001/api
    description: Local development server
  - url: https://localhost:9001/api
    description: Local development server (SSL)
  - url: http://localhost/cortex/api
    description: Nginx reverse proxy
  - url: https://localhost/cortex/api
    description: Nginx reverse proxy (SSL)
tags:
  - name: Analyzers
    description: Analyzer management
  - name: Jobs
    description: Job management
  - name: Responders
    description: Responder management
  - name: Users
    description: User management
  - name: Organizations
    description: Organization management
  - name: Health
    description: Health check
paths:
  /analyzer:
    get:
      tags:
        - Analyzers
      summary: List all analyzers
      description: Get list of all available analyzers
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Analyzers retrieved successfully
  /analyzer/{analyzer_id}:
    get:
      tags:
        - Analyzers
      summary: Get analyzer by ID
      description: Get details of a specific analyzer
      security:
        - BearerAuth: []
      parameters:
        - name: analyzer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Analyzer retrieved successfully
  /analyzer/{analyzer_id}/run:
    post:
      tags:
        - Analyzers
      summary: Run analyzer
      description: Execute an analyzer on an observable
      security:
        - BearerAuth: []
      parameters:
        - name: analyzer_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dataType
                - data
              properties:
                dataType:
                  type: string
                  example: ip
                data:
                  type: string
                  example: 1.2.3.4
                tlp:
                  type: integer
                  enum: [0, 1, 2, 3]
                  example: 2
                message:
                  type: string
      responses:
        '200':
          description: Analyzer executed successfully
  /job:
    get:
      tags:
        - Jobs
      summary: List jobs
      description: Get list of all jobs
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Jobs retrieved successfully
  /job/{job_id}:
    get:
      tags:
        - Jobs
      summary: Get job by ID
      description: Get details of a specific job
      security:
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job retrieved successfully
    delete:
      tags:
        - Jobs
      summary: Delete job
      description: Delete a job
      security:
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Job deleted
  /job/wait/{job_id}:
    get:
      tags:
        - Jobs
      summary: Wait for job completion
      description: Wait for a job to complete and return the report
      security:
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job completed
  /responder:
    get:
      tags:
        - Responders
      summary: List all responders
      description: Get list of all available responders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Responders retrieved successfully
  /responder/{responder_id}:
    get:
      tags:
        - Responders
      summary: Get responder by ID
      description: Get details of a specific responder
      security:
        - BearerAuth: []
      parameters:
        - name: responder_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Responder retrieved successfully
  /responder/{responder_id}/run:
    post:
      tags:
        - Responders
      summary: Run responder
      description: Execute a responder
      security:
        - BearerAuth: []
      parameters:
        - name: responder_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - observable
              properties:
                observable:
                  type: object
                caseId:
                  type: string
      responses:
        '200':
          description: Responder executed successfully
  /user:
    get:
      tags:
        - Users
      summary: List users
      description: Get list of all users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Users retrieved successfully
    post:
      tags:
        - Users
      summary: Create user
      description: Create a new user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login
                - name
                - roles
                - organization
              properties:
                login:
                  type: string
                name:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
                organization:
                  type: string
      responses:
        '201':
          description: User created successfully
  /user/{user_id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Get details of a specific user
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User retrieved successfully
  /organization:
    get:
      tags:
        - Organizations
      summary: List organizations
      description: Get list of all organizations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Organizations retrieved successfully
    post:
      tags:
        - Organizations
      summary: Create organization
      description: Create a new organization
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Organization created successfully
  /organization/{org_id}:
    get:
      tags:
        - Organizations
      summary: Get organization by ID
      description: Get details of a specific organization
      security:
        - BearerAuth: []
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Organization retrieved successfully
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if Cortex is running
      responses:
        '200':
          description: Cortex is healthy
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
