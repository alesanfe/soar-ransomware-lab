openapi: 3.0.3
info:
  title: TheHive API
  description: Collaborative case management platform for incident response
  version: 5.1.0
  contact:
    name: TheHive Project
servers:
  - url: http://localhost:9000/api
    description: Local development server
  - url: https://localhost:9000/api
    description: Local development server (SSL)
  - url: http://localhost/thehive/api
    description: Nginx reverse proxy
  - url: https://localhost/thehive/api
    description: Nginx reverse proxy (SSL)
tags:
  - name: Alerts
    description: Alert management
  - name: Cases
    description: Case management
  - name: Observables
    description: Observable management
  - name: Tasks
    description: Task management
  - name: Case Templates
    description: Case template management
paths:
  /alert:
    post:
      tags:
        - Alerts
      summary: Create an alert
      description: Create a new alert in TheHive
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - type
                - source
                - sourceRef
              properties:
                title:
                  type: string
                description:
                  type: string
                type:
                  type: string
                  example: external
                source:
                  type: string
                  example: MISP
                sourceRef:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Alert created successfully
  /alert/{alert_id}:
    get:
      tags:
        - Alerts
      summary: Get alert by ID
      description: Retrieve a specific alert
      security:
        - BearerAuth: []
      parameters:
        - name: alert_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Alert retrieved successfully
  /alert/_search:
    post:
      tags:
        - Alerts
      summary: Search alerts
      description: Search for alerts with filters
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: object
                range:
                  type: string
                sort:
                  type: array
                  items:
                    type: array
      responses:
        '200':
          description: Search results
  /alert/{alert_id}/markAsRead:
    post:
      tags:
        - Alerts
      summary: Mark alert as read
      description: Mark an alert as read
      security:
        - BearerAuth: []
      parameters:
        - name: alert_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Alert marked as read
  /case:
    get:
      tags:
        - Cases
      summary: List all cases
      description: Get list of all cases
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cases retrieved successfully
    post:
      tags:
        - Cases
      summary: Create a case
      description: Create a new case
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
              properties:
                title:
                  type: string
                description:
                  type: string
                severity:
                  type: integer
                  enum: [1, 2, 3, 4]
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Case created successfully
  /case/{case_id}:
    get:
      tags:
        - Cases
      summary: Get case by ID
      description: Retrieve a specific case
      security:
        - BearerAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Case retrieved successfully
    patch:
      tags:
        - Cases
      summary: Update a case
      description: Update case information
      security:
        - BearerAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                severity:
                  type: integer
                status:
                  type: string
      responses:
        '200':
          description: Case updated successfully
  /case/_list:
    get:
      tags:
        - Cases
      summary: List case templates
      description: Get list of available case templates
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Case templates retrieved
  /case/_fromTemplate/{template_id}:
    post:
      tags:
        - Cases
      summary: Create case from template
      description: Create a new case from a template
      security:
        - BearerAuth: []
      parameters:
        - name: template_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Case created from template
  /case/{case_id}/customFields:
    get:
      tags:
        - Cases
      summary: List custom fields
      description: Get custom fields for a case
      security:
        - BearerAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Custom fields retrieved
    patch:
      tags:
        - Cases
      summary: Update custom fields
      description: Update custom fields for a case
      security:
        - BearerAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Custom fields updated
  /case/{case_id}/export/misp:
    post:
      tags:
        - Cases
      summary: Share case with MISP
      description: Export case to MISP
      security:
        - BearerAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Case exported to MISP
  /case/{case_id}/observable:
    get:
      tags:
        - Observables
      summary: List observables
      description: Get observables for a case
      security:
        - BearerAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Observables retrieved
    post:
      tags:
        - Observables
      summary: Add observable
      description: Add an observable to a case
      security:
        - BearerAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dataType
                - data
              properties:
                dataType:
                  type: string
                  example: ip
                data:
                  type: string
                  example: 1.2.3.4
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Observable added
  /case/{case_id}/observable/{observable_id}:
    delete:
      tags:
        - Observables
      summary: Delete observable
      description: Delete an observable from a case
      security:
        - BearerAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
        - name: observable_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Observable deleted
  /case/{case_id}/observable/{observable_id}:
    patch:
      tags:
        - Observables
      summary: Mark observable as IOC
      description: Mark an observable as IOC
      security:
        - BearerAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
        - name: observable_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ioc:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Observable marked as IOC
  /case/{case_id}/task:
    get:
      tags:
        - Tasks
      summary: List tasks
      description: Get tasks for a case
      security:
        - BearerAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tasks retrieved
    post:
      tags:
        - Tasks
      summary: Create a task
      description: Create a new task for a case
      security:
        - BearerAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [Waiting, InProgress, Completed, Cancelled]
      responses:
        '201':
          description: Task created
  /case/{case_id}/task/{task_id}:
    patch:
      tags:
        - Tasks
      summary: Update a task
      description: Update task information
      security:
        - BearerAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
      responses:
        '200':
          description: Task updated
    delete:
      tags:
        - Tasks
      summary: Delete a task
      description: Delete a task from a case
      security:
        - BearerAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Task deleted
  /casetemplate/{template_id}:
    get:
      tags:
        - Case Templates
      summary: Get case template
      description: Retrieve a specific case template
      security:
        - BearerAuth: []
      parameters:
        - name: template_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Case template retrieved
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
