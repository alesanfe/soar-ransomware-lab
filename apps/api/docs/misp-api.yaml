openapi: 3.0.3
info:
  title: MISP API
  description: Threat intelligence sharing and collaboration platform
  version: 2.14.0
  contact:
    name: MISP Project
servers:
  - url: http://localhost:8082
    description: Local development server
  - url: https://localhost:8082
    description: Local development server (SSL)
  - url: http://localhost/misp
    description: Nginx reverse proxy
  - url: https://localhost/misp
    description: Nginx reverse proxy (SSL)
tags:
  - name: Events
    description: Event management
  - name: Attributes
    description: Attribute management
  - name: Tags
    description: Tag management
  - name: Warninglists
    description: Warninglist management
  - name: Sightings
    description: Sighting management
  - name: Server
    description: Server information
  - name: Organizations
    description: Organization management
  - name: Users
    description: User management
paths:
  /events:
    post:
      tags:
        - Events
      summary: Create event
      description: Create a new event
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - info
              properties:
                info:
                  type: string
                threat_level_id:
                  type: integer
                  enum: [1, 2, 3, 4]
                analysis:
                  type: integer
                  enum: [0, 1, 2, 3]
                distribution:
                  type: integer
                  enum: [0, 1, 2, 3, 4]
      responses:
        '200':
          description: Event created successfully
  /events/restSearch:
    post:
      tags:
        - Events
      summary: Search events
      description: Search for events with filters
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                returnFormat:
                  type: string
                limit:
                  type: integer
                page:
                  type: integer
      responses:
        '200':
          description: Search results
  /events/{event_id}:
    get:
      tags:
        - Events
      summary: Get event by ID
      description: Retrieve a specific event
      security:
        - ApiKeyAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event retrieved successfully
  /attributes:
    post:
      tags:
        - Attributes
      summary: Create attribute
      description: Create a new attribute
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - value
              properties:
                type:
                  type: string
                value:
                  type: string
                category:
                  type: string
                to_ids:
                  type: boolean
      responses:
        '200':
          description: Attribute created successfully
  /attributes/restSearch:
    post:
      tags:
        - Attributes
      summary: Search attributes
      description: Search for attributes with filters
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Search results
  /attributes/{attribute_id}:
    get:
      tags:
        - Attributes
      summary: Get attribute by ID
      description: Retrieve a specific attribute
      security:
        - ApiKeyAuth: []
      parameters:
        - name: attribute_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attribute retrieved successfully
    delete:
      tags:
        - Attributes
      summary: Delete attribute
      description: Delete an attribute
      security:
        - ApiKeyAuth: []
      parameters:
        - name: attribute_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attribute deleted
  /tags:
    get:
      tags:
        - Tags
      summary: List tags
      description: Get list of all tags
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Tags retrieved successfully
    post:
      tags:
        - Tags
      summary: Create tag
      description: Create a new tag
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                colour:
                  type: string
      responses:
        '200':
          description: Tag created successfully
  /warninglists:
    get:
      tags:
        - Warninglists
      summary: List warninglists
      description: Get list of all warninglists
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Warninglists retrieved successfully
  /sightings:
    post:
      tags:
        - Sightings
      summary: Add sighting
      description: Add a sighting for an attribute
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  type: string
                type:
                  type: string
                source:
                  type: string
      responses:
        '200':
          description: Sighting added successfully
  /servers:
    get:
      tags:
        - Server
      summary: Get server info
      description: Get server information
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Server information retrieved
  /organisations:
    get:
      tags:
        - Organizations
      summary: List organizations
      description: Get list of all organizations
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Organizations retrieved successfully
  /admin/users:
    get:
      tags:
        - Users
      summary: List users
      description: Get list of all users
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Users retrieved successfully
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
