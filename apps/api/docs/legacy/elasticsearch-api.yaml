openapi: 3.0.3
info:
  title: Elasticsearch API
  description: Distributed search and analytics engine
  version: 8.x
  contact:
    name: Elasticsearch Project
servers:
  - url: http://localhost:9201
    description: Local development server
  - url: https://localhost:9201
    description: Local development server (SSL)
  - url: http://localhost/elasticsearch
    description: Nginx reverse proxy
  - url: https://localhost/elasticsearch
    description: Nginx reverse proxy (SSL)
tags:
  - name: Cluster
    description: Cluster operations
  - name: Index
    description: Index operations
  - name: Document
    description: Document operations
  - name: Search
    description: Search operations
paths:
  /_cluster/health:
    get:
      tags:
        - Cluster
      summary: Get cluster health
      description: Get the health status of the cluster
      responses:
        '200':
          description: Cluster health retrieved
  /_cluster/state:
    get:
      tags:
        - Cluster
      summary: Get cluster state
      description: Get the state of the cluster
      responses:
        '200':
          description: Cluster state retrieved
  /_cluster/stats:
    get:
      tags:
        - Cluster
      summary: Get cluster stats
      description: Get cluster statistics
      responses:
        '200':
          description: Cluster stats retrieved
  /{index}:
    get:
      tags:
        - Index
      summary: Get index
      description: Get information about an index
      parameters:
        - name: index
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Index information retrieved
    put:
      tags:
        - Index
      summary: Create index
      description: Create a new index
      parameters:
        - name: index
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                settings:
                  type: object
                mappings:
                  type: object
      responses:
        '200':
          description: Index created
    delete:
      tags:
        - Index
      summary: Delete index
      description: Delete an index
      parameters:
        - name: index
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Index deleted
  /{index}/_mapping:
    get:
      tags:
        - Index
      summary: Get index mapping
      description: Get the mapping of an index
      parameters:
        - name: index
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Index mapping retrieved
  /{index}/_doc/{_id}:
    get:
      tags:
        - Document
      summary: Get document
      description: Get a document by ID
      parameters:
        - name: index
          in: path
          required: true
          schema:
            type: string
        - name: _id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document retrieved
    post:
      tags:
        - Document
      summary: Index document
      description: Index a document
      parameters:
        - name: index
          in: path
          required: true
          schema:
            type: string
        - name: _id
          in: path
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Document indexed
    put:
      tags:
        - Document
      summary: Create/replace document
      description: Create or replace a document
      parameters:
        - name: index
          in: path
          required: true
          schema:
            type: string
        - name: _id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Document created/replaced
    delete:
      tags:
        - Document
      summary: Delete document
      description: Delete a document
      parameters:
        - name: index
          in: path
          required: true
          schema:
            type: string
        - name: _id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document deleted
  /{index}/_search:
    get:
      tags:
        - Search
      summary: Search
      description: Search documents in an index
      parameters:
        - name: index
          in: path
          required: true
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Search results
    post:
      tags:
        - Search
      summary: Search with DSL
      description: Search documents using query DSL
      parameters:
        - name: index
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Search results
  /_bulk:
    post:
      tags:
        - Document
      summary: Bulk operations
      description: Perform multiple index/delete operations
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
      responses:
        '200':
          description: Bulk operations completed
components: { }
