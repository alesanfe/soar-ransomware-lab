# Prometheus Configuration for SOAR Ransomware Lab
# Global configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Rule files
rule_files:
  - "alert_rules.yml"
  - "recording_rules.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor for container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # TheHive metrics
  - job_name: 'thehive'
    static_configs:
      - targets: ['thehive:9000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Cortex metrics
  - job_name: 'cortex'
    static_configs:
      - targets: ['cortex:9001']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Shuffle Frontend metrics
  - job_name: 'shuffle-frontend'
    static_configs:
      - targets: ['shuffle-frontend:3001']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Shuffle Backend metrics
  - job_name: 'shuffle-backend'
    static_configs:
      - targets: ['shuffle-backend:5001']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Elasticsearch metrics
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:19200']
    metrics_path: '/_prometheus/metrics'
    scrape_interval: 30s

  # Nginx metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']
    scrape_interval: 30s

  # Docker metrics
  - job_name: 'docker'
    static_configs:
      - targets: ['docker-exporter:9323']
    scrape_interval: 30s

  # Custom SOAR application metrics
  - job_name: 'soar-app'
    static_configs:
      - targets: ['soar-app:8080']
    metrics_path: '/api/v1/metrics'
    scrape_interval: 15s

  # Blackbox exporter for endpoint monitoring
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://nginx/nginx-health
        - http://thehive:9000/api/health
        - http://cortex:9001/api/health
        - http://shuffle-frontend:3001/health
        - http://shuffle-backend:5001/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
