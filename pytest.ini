[pytest]
# Pytest configuration for SOAR Ransomware Lab

asyncio_mode = auto

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Source path so all tests can import soar_lab without sys.path.insert
pythonpath = src .

# Test paths
testpaths = tests

# Output and Coverage options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -m "not requires_docker"
    --cov=src/soar_lab
    --cov-report=term-missing
    --cov-report=html:artifacts/coverage/htmlcov
    --cov-report=xml:artifacts/coverage/coverage.xml
    --cov-report=annotate:artifacts/coverage/coverage_annotate
    --cov-fail-under=80

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout (if pytest-timeout is installed)
# timeout = 300

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    requires_docker: marks tests that require Docker to be running
    requires_external: marks tests that depend on external services (TheHive, Cortex, Shuffle, etc.)
    e2e: marks end-to-end tests that may take longer to run
    unit: marks unit tests that don't require external dependencies
    integration: marks integration tests that require multiple components
    atomic: marks atomic red-team simulation tests
    performance: marks performance and load tests
    security: marks security hardening and vulnerability tests
    smoke: marks smoke tests for fast post-deployment validation
    smoke_critical: marks P0 smoke tests — rollback immediately if these fail
    smoke_high: marks P1 smoke tests — rollback if these fail
    smoke_medium: marks P2 smoke tests — investigate but do not rollback
